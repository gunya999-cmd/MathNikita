# Delta release gate for lesson 65. Earlier certification workflows continue to protect prior lessons.
name: Course 1-65 certification

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: course-1-65-certification-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-content:
    name: Build + content + pedagogy through 65
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: >-
          npx playwright test
          tests/course-plan.spec.ts
          tests/pedagogical-practice-quality.spec.ts
          tests/extended-practice-count.spec.ts
          tests/lesson-sixty-five-full-flow.spec.ts
          --config=playwright.desktop.config.ts --workers=1
      - name: Complete all 20 mandatory practice tasks / 50 responses for lesson 65
        env:
          PRACTICE_START: 65
          PRACTICE_END: 65
        run: npx playwright test tests/extended-practice-all-lessons.spec.ts --config=playwright.desktop.config.ts --workers=1

  chromium-65:
    name: Chromium runtime 65
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/lesson-sixty-five-full-flow.spec.ts tests/lesson-sixty-five-ipad.spec.ts --config=playwright.desktop.config.ts --workers=1

  webkit-65:
    name: iPad WebKit runtime 65
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx playwright install --with-deps webkit
      - run: npx playwright test tests/lesson-sixty-five-full-flow.spec.ts tests/lesson-sixty-five-ipad.spec.ts --workers=1

  voice-65:
    name: Sulafat voice + interruption 65
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/lesson-sixty-five-voice.spec.ts --config=playwright.desktop.config.ts --workers=1

  certified:
    name: COURSE 1-65 DELTA CERTIFIED
    if: always()
    needs: [build-content, chromium-65, webkit-65, voice-65]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every lesson 65 release lane passed
        env:
          BUILD_CONTENT: ${{ needs.build-content.result }}
          CHROMIUM_65: ${{ needs.chromium-65.result }}
          WEBKIT_65: ${{ needs.webkit-65.result }}
          VOICE_65: ${{ needs.voice-65.result }}
        run: |
          test "$BUILD_CONTENT" = success
          test "$CHROMIUM_65" = success
          test "$WEBKIT_65" = success
          test "$VOICE_65" = success
          echo "Lesson 65 delta is certified."
