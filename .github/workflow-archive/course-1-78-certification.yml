# Delta release gate for lesson 78. Earlier certification workflows continue to protect prior lessons.
name: Course 1-78 certification

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: course-1-78-certification-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-content:
    name: Build + content + pedagogy through 78
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: >-
          npx playwright test
          tests/course-plan.spec.ts
          tests/pedagogical-practice-quality.spec.ts
          tests/extended-practice-count.spec.ts
          tests/lesson-seventy-eight-source.spec.ts
          tests/lesson-seventy-eight-full-flow.spec.ts
          --config=playwright.desktop.config.ts --workers=1
      - name: Complete all 20 mandatory practice tasks / 50 responses for lesson 78
        run: npx playwright test tests/lesson-seventy-eight-practice.spec.ts --config=playwright.desktop.config.ts --workers=1

  chromium-78:
    name: Chromium runtime 78
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/lesson-seventy-eight-full-flow.spec.ts tests/lesson-seventy-eight-ipad.spec.ts --config=playwright.desktop.config.ts --workers=1

  webkit-78:
    name: iPad WebKit runtime 78
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx playwright install --with-deps webkit
      - run: npx playwright test tests/lesson-seventy-eight-full-flow.spec.ts tests/lesson-seventy-eight-ipad.spec.ts --workers=1

  voice-78:
    name: Sulafat voice + interruption 78
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/lesson-seventy-eight-voice.spec.ts --config=playwright.desktop.config.ts --workers=1

  certified:
    name: COURSE 1-78 DELTA CERTIFIED
    if: always()
    needs: [build-content, chromium-78, webkit-78, voice-78]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every lesson 78 release lane passed
        env:
          BUILD_CONTENT: ${{ needs.build-content.result }}
          CHROMIUM_78: ${{ needs.chromium-78.result }}
          WEBKIT_78: ${{ needs.webkit-78.result }}
          VOICE_78: ${{ needs.voice-78.result }}
        run: |
          test "$BUILD_CONTENT" = success
          test "$CHROMIUM_78" = success
          test "$WEBKIT_78" = success
          test "$VOICE_78" = success
          echo "Lesson 78 delta is certified."
