# Delta release gate for lesson 69. Earlier certification workflows continue to protect prior lessons.
name: Course 1-69 certification

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: course-1-69-certification-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-content:
    name: Build + content + pedagogy through 69
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: >-
          npx playwright test
          tests/course-plan.spec.ts
          tests/pedagogical-practice-quality.spec.ts
          tests/extended-practice-count.spec.ts
          tests/lesson-sixty-nine-source.spec.ts
          tests/lesson-sixty-nine-full-flow.spec.ts
          --config=playwright.desktop.config.ts --workers=1
      - name: Complete all 20 mandatory practice tasks / 50 responses for lesson 69
        run: npx playwright test tests/lesson-sixty-nine-practice.spec.ts --config=playwright.desktop.config.ts --workers=1

  chromium-69:
    name: Chromium runtime 69
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/lesson-sixty-nine-full-flow.spec.ts tests/lesson-sixty-nine-ipad.spec.ts --config=playwright.desktop.config.ts --workers=1

  webkit-69:
    name: iPad WebKit runtime 69
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx playwright install --with-deps webkit
      - run: npx playwright test tests/lesson-sixty-nine-full-flow.spec.ts tests/lesson-sixty-nine-ipad.spec.ts --workers=1

  voice-69:
    name: Sulafat voice + interruption 69
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/lesson-sixty-nine-voice.spec.ts --config=playwright.desktop.config.ts --workers=1

  certified:
    name: COURSE 1-69 DELTA CERTIFIED
    if: always()
    needs: [build-content, chromium-69, webkit-69, voice-69]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every lesson 69 release lane passed
        env:
          BUILD_CONTENT: ${{ needs.build-content.result }}
          CHROMIUM_69: ${{ needs.chromium-69.result }}
          WEBKIT_69: ${{ needs.webkit-69.result }}
          VOICE_69: ${{ needs.voice-69.result }}
        run: |
          test "$BUILD_CONTENT" = success
          test "$CHROMIUM_69" = success
          test "$WEBKIT_69" = success
          test "$VOICE_69" = success
          echo "Lesson 69 delta is certified."
