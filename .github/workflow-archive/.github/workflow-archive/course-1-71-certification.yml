# Delta release gate for lesson 71. Earlier certification workflows continue to protect prior lessons.
name: Course 1-71 certification

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: course-1-71-certification-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-content:
    name: Build + content + pedagogy through 71
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: >-
          npx playwright test
          tests/course-plan.spec.ts
          tests/pedagogical-practice-quality.spec.ts
          tests/extended-practice-count.spec.ts
          tests/lesson-seventy-one-source.spec.ts
          tests/lesson-seventy-one-full-flow.spec.ts
          --config=playwright.desktop.config.ts --workers=1
      - name: Complete all 20 mandatory practice tasks / 50 responses for lesson 71
        run: npx playwright test tests/lesson-seventy-one-practice.spec.ts --config=playwright.desktop.config.ts --workers=1

  chromium-71:
    name: Chromium runtime 71
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/lesson-seventy-one-full-flow.spec.ts tests/lesson-seventy-one-ipad.spec.ts --config=playwright.desktop.config.ts --workers=1

  webkit-71:
    name: iPad WebKit runtime 71
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx playwright install --with-deps webkit
      - run: npx playwright test tests/lesson-seventy-one-full-flow.spec.ts tests/lesson-seventy-one-ipad.spec.ts --workers=1

  voice-71:
    name: Sulafat voice + interruption 71
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/lesson-seventy-one-voice.spec.ts --config=playwright.desktop.config.ts --workers=1

  certified:
    name: COURSE 1-71 DELTA CERTIFIED
    if: always()
    needs: [build-content, chromium-71, webkit-71, voice-71]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every lesson 71 release lane passed
        env:
          BUILD_CONTENT: ${{ needs.build-content.result }}
          CHROMIUM_71: ${{ needs.chromium-71.result }}
          WEBKIT_71: ${{ needs.webkit-71.result }}
          VOICE_71: ${{ needs.voice-71.result }}
        run: |
          test "$BUILD_CONTENT" = success
          test "$CHROMIUM_71" = success
          test "$WEBKIT_71" = success
          test "$VOICE_71" = success
          echo "Lesson 71 delta is certified."
