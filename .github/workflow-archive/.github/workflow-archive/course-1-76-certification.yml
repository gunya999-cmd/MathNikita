# Delta release gate for lesson 76. Earlier certification workflows continue to protect prior lessons.
name: Course 1-76 certification

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: course-1-76-certification-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-content:
    name: Build + content + pedagogy through 76
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: >-
          npx playwright test
          tests/course-plan.spec.ts
          tests/pedagogical-practice-quality.spec.ts
          tests/extended-practice-count.spec.ts
          tests/lesson-seventy-six-source.spec.ts
          tests/lesson-seventy-six-full-flow.spec.ts
          --config=playwright.desktop.config.ts --workers=1
      - name: Complete all 20 mandatory practice tasks / 50 responses for lesson 76
        run: npx playwright test tests/lesson-seventy-six-practice.spec.ts --config=playwright.desktop.config.ts --workers=1

  chromium-76:
    name: Chromium runtime 76
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/lesson-seventy-six-full-flow.spec.ts tests/lesson-seventy-six-ipad.spec.ts --config=playwright.desktop.config.ts --workers=1

  webkit-76:
    name: iPad WebKit runtime 76
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx playwright install --with-deps webkit
      - run: npx playwright test tests/lesson-seventy-six-full-flow.spec.ts tests/lesson-seventy-six-ipad.spec.ts --workers=1

  voice-76:
    name: Sulafat voice + interruption 76
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/lesson-seventy-six-voice.spec.ts --config=playwright.desktop.config.ts --workers=1

  certified:
    name: COURSE 1-76 DELTA CERTIFIED
    if: always()
    needs: [build-content, chromium-76, webkit-76, voice-76]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every lesson 76 release lane passed
        env:
          BUILD_CONTENT: ${{ needs.build-content.result }}
          CHROMIUM_76: ${{ needs.chromium-76.result }}
          WEBKIT_76: ${{ needs.webkit-76.result }}
          VOICE_76: ${{ needs.voice-76.result }}
        run: |
          test "$BUILD_CONTENT" = success
          test "$CHROMIUM_76" = success
          test "$WEBKIT_76" = success
          test "$VOICE_76" = success
          echo "Lesson 76 delta is certified."
