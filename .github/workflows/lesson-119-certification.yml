name: Lesson 119 certification

on:
  workflow_dispatch:
  push:
    branches: [lesson-119-build]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: lesson-119-certification-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  chromium-119:
    name: Chromium · source, flow and Sulafat lesson 119
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Source, player and course-boundary contract
        run: npx playwright test tests/lesson-one-hundred-nineteen-data.spec.ts tests/lesson-one-hundred-nineteen-player.spec.ts tests/course-plan.spec.ts --config=playwright.desktop.config.ts --workers=1
      - name: Opening, navigation and exact §33 practice flow
        run: npx playwright test tests/lesson-one-hundred-nineteen-flow.spec.ts --config=playwright.desktop.config.ts --workers=1
      - name: Sulafat narration payload audit
        run: npx playwright test tests/lesson-one-hundred-nineteen-voice.spec.ts --config=playwright.desktop.config.ts --workers=1

  webkit-119:
    name: iPad WebKit · lesson 119
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - run: npx playwright install --with-deps webkit
      - name: iPad layout and first exact addition-rule task
        run: npx playwright test tests/lesson-one-hundred-nineteen-ipad.spec.ts --workers=1

  certified:
    name: LESSON 119 CERTIFIED
    if: always()
    needs: [chromium-119, webkit-119]
    runs-on: ubuntu-latest
    steps:
      - name: Require Chromium and iPad lanes
        env:
          CHROMIUM_119: ${{ needs.chromium-119.result }}
          WEBKIT_119: ${{ needs.webkit-119.result }}
        run: |
          test "$CHROMIUM_119" = success
          test "$WEBKIT_119" = success
          echo "Lesson 119 §33 source, decimal addition, 20/50 practice, Sulafat and iPad checks are certified."
