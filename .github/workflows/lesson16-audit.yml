name: Lesson 16 audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/NaturalNumberComparisonPlayer.tsx'
      - 'src/LessonSixteenOpening.ts'
      - 'src/naturalComparison.css'
      - 'src/CatMentor.tsx'
      - 'src/data/lessonSixteenMentorScripts.json'
      - 'src/data/extendedPracticeLesson16.ts'
      - 'src/data/lessonSixteenMastery.ts'
      - 'src/data/extendedPracticeData.ts'
      - 'src/extendedPracticeEngine.ts'
      - 'src/lessonSixteenRevisionMigration.ts'
      - 'src/ExtendedPracticeLab.tsx'
      - 'src/LessonReflection.tsx'
      - 'src/PracticePythagoras.tsx'
      - 'src/VoiceNarrator.tsx'
      - 'src/MentorResponsiveBehavior.tsx'
      - 'tests/lesson-sixteen-audit.spec.ts'
      - 'tests/lesson-sixteen-feedback-audit.spec.ts'
      - '.github/workflows/lesson16-audit.yml'
  push:
    branches: [main]
    paths:
      - 'src/NaturalNumberComparisonPlayer.tsx'
      - 'src/LessonSixteenOpening.ts'
      - 'src/naturalComparison.css'
      - 'src/CatMentor.tsx'
      - 'src/data/lessonSixteenMentorScripts.json'
      - 'src/data/extendedPracticeLesson16.ts'
      - 'src/data/lessonSixteenMastery.ts'
      - 'src/data/extendedPracticeData.ts'
      - 'src/extendedPracticeEngine.ts'
      - 'src/lessonSixteenRevisionMigration.ts'
      - 'src/ExtendedPracticeLab.tsx'
      - 'src/LessonReflection.tsx'
      - 'src/PracticePythagoras.tsx'
      - 'src/VoiceNarrator.tsx'
      - 'src/MentorResponsiveBehavior.tsx'
      - 'tests/lesson-sixteen-audit.spec.ts'
      - 'tests/lesson-sixteen-feedback-audit.spec.ts'
      - '.github/workflows/lesson16-audit.yml'

permissions:
  contents: read

jobs:
  lesson-sixteen:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Run lesson 16 audit
        run: npx playwright test tests/lesson-sixteen-audit.spec.ts tests/lesson-sixteen-feedback-audit.spec.ts --config=playwright.desktop.config.ts --workers=1
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lesson16-audit-${{ github.sha }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
