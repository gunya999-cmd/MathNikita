# Delta release gate for lesson 85. Keep PR checks focused on the changed lesson;
# cumulative course hard-certification is triggered once for the exact release SHA.
name: Course 1-85 certification

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: course-1-85-certification-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  chromium-85:
    name: Chromium · contract, practice, runtime and Sulafat 85
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Verify course boundary, pedagogy and lesson 85 source contract
        run: >-
          npx playwright test
          tests/course-plan.spec.ts
          tests/pedagogical-practice-quality.spec.ts
          tests/extended-practice-count.spec.ts
          tests/lesson-eighty-five-source.spec.ts
          --config=playwright.desktop.config.ts --workers=1
      - name: Complete lesson 85 Chromium runtime
        run: npx playwright test tests/lesson-eighty-five-full-flow.spec.ts tests/lesson-eighty-five-ipad.spec.ts --config=playwright.desktop.config.ts --workers=1
      - name: Complete all 20 mandatory practice tasks / 50 responses
        run: npx playwright test tests/lesson-eighty-five-practice.spec.ts --config=playwright.desktop.config.ts --workers=1
      - name: Verify Sulafat sequencing and interruption
        run: npx playwright test tests/lesson-eighty-five-voice.spec.ts --config=playwright.desktop.config.ts --workers=1

  webkit-85:
    name: iPad WebKit runtime 85
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - run: npx playwright install --with-deps webkit
      - run: npx playwright test tests/lesson-eighty-five-full-flow.spec.ts tests/lesson-eighty-five-ipad.spec.ts --workers=1

  certified:
    name: COURSE 1-85 DELTA CERTIFIED
    if: always()
    needs: [chromium-85, webkit-85]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless both focused lesson 85 lanes passed
        env:
          CHROMIUM_85: ${{ needs.chromium-85.result }}
          WEBKIT_85: ${{ needs.webkit-85.result }}
        run: |
          test "$CHROMIUM_85" = success
          test "$WEBKIT_85" = success
          echo "Lesson 85 delta is certified."