name: Lesson 105 certification

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: lesson-105-certification-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  chromium-105:
    name: Chromium · source, flow and Sulafat lesson 105
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Source, player and course-boundary contract
        run: npx playwright test tests/lesson-one-hundred-five-data.spec.ts tests/lesson-one-hundred-five-player.spec.ts tests/course-plan.spec.ts --config=playwright.desktop.config.ts --workers=1
      - name: Opening, navigation and mandatory practice flow
        run: npx playwright test tests/lesson-one-hundred-five-flow.spec.ts --config=playwright.desktop.config.ts --workers=1
      - name: Sulafat narration payload audit
        run: npx playwright test tests/lesson-one-hundred-five-voice.spec.ts --config=playwright.desktop.config.ts --workers=1

  webkit-105:
    name: iPad WebKit · lesson 105
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - run: npx playwright install --with-deps webkit
      - name: iPad layout and exact source task
        run: npx playwright test tests/lesson-one-hundred-five-ipad.spec.ts --workers=1

  certified:
    name: LESSON 105 CERTIFIED
    if: always()
    needs: [chromium-105, webkit-105]
    runs-on: ubuntu-latest
    steps:
      - name: Require Chromium and iPad lanes
        env:
          CHROMIUM_105: ${{ needs.chromium-105.result }}
          WEBKIT_105: ${{ needs.webkit-105.result }}
        run: |
          test "$CHROMIUM_105" = success
          test "$WEBKIT_105" = success
          echo "Lesson 105 source, flow, boundary, mandatory practice, Sulafat and iPad checks are certified."
