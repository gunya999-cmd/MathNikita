name: Lesson 114 certification

on:
  workflow_dispatch:
  push:
    branches: [lesson-114-build]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: lesson-114-certification-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  chromium-114:
    name: Chromium · source, flow and Sulafat lesson 114
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Source, player and course-boundary contract
        run: npx playwright test tests/lesson-one-hundred-fourteen-data.spec.ts tests/lesson-one-hundred-fourteen-player.spec.ts tests/course-plan.spec.ts --config=playwright.desktop.config.ts --workers=1
      - name: Opening, navigation and exact §31 practice flow
        run: npx playwright test tests/lesson-one-hundred-fourteen-flow.spec.ts --config=playwright.desktop.config.ts --workers=1
      - name: Sulafat narration payload audit
        run: npx playwright test tests/lesson-one-hundred-fourteen-voice.spec.ts --config=playwright.desktop.config.ts --workers=1

  webkit-114:
    name: iPad WebKit · lesson 114
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - run: npx playwright install --with-deps webkit
      - name: iPad layout and interval source task
        run: npx playwright test tests/lesson-one-hundred-fourteen-ipad.spec.ts --workers=1

  certified:
    name: LESSON 114 CERTIFIED
    if: always()
    needs: [chromium-114, webkit-114]
    runs-on: ubuntu-latest
    steps:
      - name: Require Chromium and iPad lanes
        env:
          CHROMIUM_114: ${{ needs.chromium-114.result }}
          WEBKIT_114: ${{ needs.webkit-114.result }}
        run: |
          test "$CHROMIUM_114" = success
          test "$WEBKIT_114" = success
          echo "Lesson 114 §31 source, flow, boundary, 20/50 practice, Sulafat and iPad checks are certified."
