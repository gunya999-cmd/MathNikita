name: Late lessons 153-171

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: late-lessons-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  certify:
    name: Lessons 153-171 regression
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Build application
        run: npm run build
      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Certify lessons 153-171 and catalog in Chromium
        run: >-
          npx playwright test
          tests/lesson-one-hundred-fifty-three.spec.ts
          tests/lesson-one-hundred-fifty-three-player.spec.ts
          tests/lesson-one-hundred-fifty-three-flow.spec.ts
          tests/lesson-one-hundred-fifty-four.spec.ts
          tests/lesson-one-hundred-fifty-four-player.spec.ts
          tests/lesson-one-hundred-fifty-four-flow.spec.ts
          tests/lesson-one-hundred-fifty-five.spec.ts
          tests/lesson-one-hundred-fifty-five-player.spec.ts
          tests/lesson-one-hundred-fifty-five-flow.spec.ts
          tests/lesson-one-hundred-fifty-six-data.spec.ts
          tests/lesson-one-hundred-fifty-six-player.spec.ts
          tests/lesson-one-hundred-fifty-six-flow.spec.ts
          tests/lesson-one-hundred-fifty-seven.spec.ts
          tests/lesson-one-hundred-fifty-seven-player.spec.ts
          tests/lesson-one-hundred-fifty-seven-flow.spec.ts
          tests/lesson-one-hundred-fifty-eight.spec.ts
          tests/lesson-one-hundred-fifty-eight-player.spec.ts
          tests/lesson-one-hundred-fifty-eight-flow.spec.ts
          tests/lesson-one-hundred-fifty-nine.spec.ts
          tests/lesson-one-hundred-fifty-nine-player.spec.ts
          tests/lesson-one-hundred-fifty-nine-flow.spec.ts
          tests/lesson-one-hundred-sixty.spec.ts
          tests/lesson-one-hundred-sixty-player.spec.ts
          tests/lesson-one-hundred-sixty-flow.spec.ts
          tests/lesson-one-hundred-sixty-one.spec.ts
          tests/lesson-one-hundred-sixty-one-player.spec.ts
          tests/lesson-one-hundred-sixty-one-flow.spec.ts
          tests/lesson-one-hundred-sixty-two.spec.ts
          tests/lesson-one-hundred-sixty-two-player.spec.ts
          tests/lesson-one-hundred-sixty-two-flow.spec.ts
          tests/lesson-one-hundred-sixty-three.spec.ts
          tests/lesson-one-hundred-sixty-three-player.spec.ts
          tests/lesson-one-hundred-sixty-three-flow.spec.ts
          tests/lesson-one-hundred-sixty-four.spec.ts
          tests/lesson-one-hundred-sixty-four-player.spec.ts
          tests/lesson-one-hundred-sixty-four-flow.spec.ts
          tests/lesson-one-hundred-sixty-five.spec.ts
          tests/lesson-one-hundred-sixty-five-player.spec.ts
          tests/lesson-one-hundred-sixty-five-flow.spec.ts
          tests/lesson-one-hundred-sixty-six.spec.ts
          tests/lesson-one-hundred-sixty-six-player.spec.ts
          tests/lesson-one-hundred-sixty-six-flow.spec.ts
          tests/lesson-one-hundred-sixty-seven.spec.ts
          tests/lesson-one-hundred-sixty-seven-player.spec.ts
          tests/lesson-one-hundred-sixty-seven-flow.spec.ts
          tests/lesson-one-hundred-sixty-eight.spec.ts
          tests/lesson-one-hundred-sixty-eight-player.spec.ts
          tests/lesson-one-hundred-sixty-eight-flow.spec.ts
          tests/lesson-one-hundred-sixty-nine.spec.ts
          tests/lesson-one-hundred-sixty-nine-player.spec.ts
          tests/lesson-one-hundred-sixty-nine-flow.spec.ts
          tests/lesson-one-hundred-seventy.spec.ts
          tests/lesson-one-hundred-seventy-player.spec.ts
          tests/lesson-one-hundred-seventy-flow.spec.ts
          tests/lesson-one-hundred-seventy-one.spec.ts
          tests/lesson-one-hundred-seventy-one-player.spec.ts
          tests/lesson-one-hundred-seventy-one-flow.spec.ts
          tests/course-plan.spec.ts
          --config=playwright.desktop.config.ts --workers=1
      - name: Certify lessons 153-171 on iPad WebKit
        run: >-
          npx playwright test
          tests/lesson-one-hundred-fifty-three-ipad.spec.ts
          tests/lesson-one-hundred-fifty-four-ipad.spec.ts
          tests/lesson-one-hundred-fifty-five-ipad.spec.ts
          tests/lesson-one-hundred-fifty-six-ipad.spec.ts
          tests/lesson-one-hundred-fifty-seven-ipad.spec.ts
          tests/lesson-one-hundred-fifty-eight-ipad.spec.ts
          tests/lesson-one-hundred-fifty-nine-ipad.spec.ts
          tests/lesson-one-hundred-sixty-ipad.spec.ts
          tests/lesson-one-hundred-sixty-one-ipad.spec.ts
