          tests/lesson-one-hundred-sixty-four-ipad.spec.ts
          tests/lesson-one-hundred-sixty-five-ipad.spec.ts
          tests/lesson-one-hundred-sixty-six-ipad.spec.ts
          tests/lesson-one-hundred-sixty-seven-ipad.spec.ts
          tests/lesson-one-hundred-sixty-eight-ipad.spec.ts
          tests/lesson-one-hundred-sixty-nine-ipad.spec.ts
          tests/lesson-one-hundred-seventy-ipad.spec.ts
          tests/lesson-one-hundred-seventy-one-ipad.spec.ts
          --workers=1
