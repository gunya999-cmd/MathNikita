name: Release full voice
on:
  push:
    branches: [fix/voice-full-gate]
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/lessons-one-to-five-every-stage-voice.spec.ts tests/lessons-one-to-four-pythagoras-voice.spec.ts tests/lessons-six-to-sixteen-every-stage-voice.spec.ts tests/lessons-six-to-sixteen-voice-sequencing.spec.ts tests/lessons-seventeen-to-twenty-three-every-stage-voice.spec.ts tests/lessons-seventeen-to-twenty-three-voice-sequencing.spec.ts tests/lesson-twenty-four-voice.spec.ts tests/lesson-twenty-five-voice.spec.ts tests/lesson-twenty-six-voice.spec.ts tests/lesson-twenty-seven-voice.spec.ts tests/lesson-thirty-four-voice.spec.ts tests/lesson-thirty-five-voice.spec.ts tests/lesson-thirty-six-voice.spec.ts tests/lesson-thirty-seven-voice.spec.ts tests/lesson-thirty-eight-voice.spec.ts tests/lesson-thirty-nine-voice.spec.ts --config=playwright.desktop.config.ts --workers=1
