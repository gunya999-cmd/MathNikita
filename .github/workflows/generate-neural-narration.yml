name: Generate neural narration

on:
  push:
    branches:
      - 'feature/**'
    paths:
      - 'scripts/extract_narration.mjs'
      - 'scripts/generate_piper_audio.py'
      - 'src/data/mentorScripts.json'
      - 'src/LessonOpening.tsx'
      - 'src/LessonPlayer.tsx'
      - 'src/NaturalRowPracticePlayer.tsx'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[voice-generated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install project dependencies
        run: npm install

      - name: Extract lesson and mentor narration text
        run: node scripts/extract_narration.mjs

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Piper and audio tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install piper-tts
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download Russian neural voice
        run: python -m piper.download_voices --data-dir .voice-models ru_RU-irina-medium

      - name: Generate static MP3 narration
        run: |
          python scripts/generate_piper_audio.py \
            --items build/narration-items.json \
            --model .voice-models/ru_RU-irina-medium.onnx \
            --output public/audio/neural \
            --voice-name 'Ирина'

      - name: Commit generated audio
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/audio/neural
          if git diff --cached --quiet; then
            echo 'Narration is already current.'
          else
            git commit -m 'Generate Piper neural narration [voice-generated]'
            git push origin HEAD:${{ github.ref_name }}
          fi
