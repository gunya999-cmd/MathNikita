name: Worker version endpoint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'worker/entry.ts'
      - 'worker/buildVersion.ts'
      - 'scripts/write-build-version.mjs'
      - 'scripts/version-api-smoke.mjs'
      - 'package.json'
      - 'wrangler.jsonc'
      - '.github/workflows/version-endpoint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version-api:
    name: Wrangler · git SHA + Cloudflare version metadata
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run build
      - run: npx -y wrangler@4.114.0 deploy --dry-run --outdir .wrangler-version-dry-run
      - run: node scripts/version-api-smoke.mjs

  production-version:
    if: github.event_name == 'push'
    name: Production · deployed SHA matches main
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Wait for Cloudflare production deployment and verify exact SHA
        env:
          EXPECTED_SHA: ${{ github.sha }}
          VERSION_URL: https://mathnikita.gunya999.workers.dev/api/version
        run: |
          set -u
          for attempt in $(seq 1 60); do
            body="$(curl --silent --show-error --fail --max-time 15 "$VERSION_URL" 2>/dev/null || true)"
            actual="$(BODY="$body" node -e 'try{const b=JSON.parse(process.env.BODY||"{}");if(!b.workerVersion?.id||!b.workerVersion?.timestamp)process.exit(2);process.stdout.write(String(b.gitSha||""))}catch{process.exit(3)}' 2>/dev/null || true)"
            if [ "$actual" = "$EXPECTED_SHA" ]; then
              echo "Production is serving expected Git SHA: $actual"
              BODY="$body" node -e 'const b=JSON.parse(process.env.BODY);console.log(`Worker version: ${b.workerVersion.id}`);console.log(`Worker timestamp: ${b.workerVersion.timestamp}`);console.log(`Build UUID: ${b.buildUuid}`)'
              exit 0
            fi
            if [ -n "$actual" ]; then
              echo "Attempt $attempt: production SHA is $actual; expected $EXPECTED_SHA"
            else
              echo "Attempt $attempt: /api/version is not available with valid version metadata yet"
            fi
            sleep 10
          done
          echo "Production did not reach expected SHA $EXPECTED_SHA"
          exit 1
