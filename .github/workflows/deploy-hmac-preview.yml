name: Deploy HMAC pepper production preview

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/deploy-hmac-preview.yml'

permissions:
  contents: read

jobs:
  deploy-and-smoke:
    if: github.event_name == 'pull_request' && github.head_ref == 'ops/deploy-hmac-preview'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRODUCT_SHA: d458e9fc7038687366a0ee2cfe4bbeb6557f3049
      BASE_URL: https://mathnikita.gunya999.workers.dev
      QA_STUDENT_ID: qa-hmac-${{ github.run_id }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
    steps:
      - name: Checkout exact HMAC product commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.PRODUCT_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Build exact HMAC product commit
        env:
          WORKERS_CI_COMMIT_SHA: ${{ env.PRODUCT_SHA }}
          WORKERS_CI_BRANCH: fix/cloud-pin-hmac-pepper
          WORKERS_CI_BUILD_UUID: hmac-preview-${{ github.run_id }}
        run: npm run build
      - name: Resolve existing production D1 binding
        run: |
          set -eu
          npx -y wrangler@4.118.0 d1 list --json > /tmp/d1-list.json
          node <<'NODE'
          const fs=require('fs');
          const list=JSON.parse(fs.readFileSync('/tmp/d1-list.json','utf8'));
          const db=Array.isArray(list)?list.find(x=>x?.name==='mathnikita-db'):null;
          if(!db)throw new Error('mathnikita-db not found');
          const id=db.uuid||db.id;if(!id)throw new Error('mathnikita-db id missing');
          const config=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          config.d1_databases=[{binding:'DB',database_name:'mathnikita-db',database_id:id}];
          fs.writeFileSync('.wrangler.hmac.json',JSON.stringify(config,null,2));
          console.log('Existing mathnikita-db resolved.');
          NODE
      - name: Generate production pepper file without printing its value
        run: |
          set -eu
          PEPPER="$(openssl rand -hex 32)"
          PEPPER="$PEPPER" node -e 'const fs=require("fs");fs.writeFileSync("/tmp/hmac-secrets.json",JSON.stringify({PROFILE_PIN_PEPPER:process.env.PEPPER}))'
          unset PEPPER
          chmod 600 /tmp/hmac-secrets.json
          echo 'Generated 256-bit pepper in ephemeral runner file.'
      - name: Deploy HMAC product with existing D1 and pepper atomically
        run: npx -y wrangler@4.118.0 deploy --config .wrangler.hmac.json --no-x-provision --secrets-file /tmp/hmac-secrets.json
      - name: Verify exact HMAC production SHA and full cloud lifecycle
        run: |
          node <<'NODE'
          const base=process.env.BASE_URL;
          const expected=process.env.PRODUCT_SHA;
          const studentId=process.env.QA_STUDENT_ID;
          const pin='2468';
          async function json(path,options={}){
            const response=await fetch(base+path,{...options,headers:{'content-type':'application/json',...(options.headers||{})}});
            const text=await response.text();let body={};try{body=text?JSON.parse(text):{}}catch{body={raw:text}}
            if(!response.ok)throw new Error(`${path} ${response.status}: ${JSON.stringify(body)}`);
            return body;
          }
          const version=await json('/api/version');
          if(version.gitSha!==expected)throw new Error(`Production SHA ${version.gitSha}; expected ${expected}`);
          const status=await json('/api/cloud/status');if(status.configured!==true)throw new Error('Cloud status not configured');
          const registered=await json('/api/cloud/register',{method:'POST',body:JSON.stringify({studentId,name:'QA HMAC',pin,entries:{'mathnikita:qa':'before'}})});
          if(!registered.ok||!registered.token||!registered.student?.code||!registered.recoveryCode)throw new Error('Incomplete registration');
          const code=registered.student.code;const recovery=registered.recoveryCode;const token=registered.token;const revision=registered.revision;
          const wrong=await fetch(base+'/api/cloud/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({code,pin:'9999'})});
          if(wrong.status!==401)throw new Error(`Wrong PIN expected 401, got ${wrong.status}`);
          const login=await json('/api/cloud/login',{method:'POST',body:JSON.stringify({code,pin})});
          if(login.entries?.['mathnikita:qa']!=='before')throw new Error('Initial progress not restored');
          const sync=await json('/api/cloud/sync',{method:'POST',headers:{authorization:`Bearer ${token}`},body:JSON.stringify({baseRevision:revision,changes:{'mathnikita:qa':'after','mathnikita:qa2':'ok'}})});
          const snap=await json('/api/cloud/snapshot',{headers:{authorization:`Bearer ${token}`}});
          if(snap.entries?.['mathnikita:qa']!=='after'||snap.entries?.['mathnikita:qa2']!=='ok')throw new Error('Synced progress missing');
          const recovered=await json('/api/cloud/recover',{method:'POST',body:JSON.stringify({code,recoveryCode:recovery,newPin:'5678'})});
          if(!recovered.recoveryCode||recovered.recoveryCode===recovery)throw new Error('Recovery code did not rotate');
          const oldPin=await fetch(base+'/api/cloud/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({code,pin})});
          if(oldPin.status!==401)throw new Error('Old PIN still works after recovery');
          const fresh=await json('/api/cloud/login',{method:'POST',body:JSON.stringify({code,pin:'5678'})});
          if(fresh.entries?.['mathnikita:qa']!=='after'||fresh.entries?.['mathnikita:qa2']!=='ok')throw new Error('Progress lost after recovery');
          console.log(`LIVE HMAC CLOUD PASS revision=${sync.revision}: register -> wrong PIN -> login -> sync -> snapshot -> recovery -> new PIN login`);
          NODE
      - name: Remove QA profile from production D1
        if: always()
        run: |
          set -eu
          cat > /tmp/qa-hmac-cleanup.sql <<SQL
          DELETE FROM progress_history WHERE student_id='${QA_STUDENT_ID}';
          DELETE FROM student_sessions WHERE student_id='${QA_STUDENT_ID}';
          DELETE FROM student_progress WHERE student_id='${QA_STUDENT_ID}';
          DELETE FROM students WHERE id='${QA_STUDENT_ID}';
          SQL
          npx -y wrangler@4.118.0 d1 execute mathnikita-db --remote --file=/tmp/qa-hmac-cleanup.sql
          rm -f /tmp/hmac-secrets.json .wrangler.hmac.json
          echo 'QA HMAC profile cleaned.'
