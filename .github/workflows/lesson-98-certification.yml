name: Lesson 98 certification

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: lesson-98-certification-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  chromium-98:
    name: Chromium · source, flow and Sulafat lesson 98
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Source and player contract
        run: npx playwright test tests/lesson-ninety-eight-data.spec.ts tests/lesson-ninety-eight-player.spec.ts --config=playwright.desktop.config.ts --workers=1
      - name: Opening, navigation and mandatory practice flow
        run: npx playwright test tests/lesson-ninety-eight-flow.spec.ts --config=playwright.desktop.config.ts --workers=1
      - name: Sulafat narration payload audit
        run: npx playwright test tests/lesson-ninety-eight-voice.spec.ts --config=playwright.desktop.config.ts --workers=1

  webkit-98:
    name: iPad WebKit · lesson 98
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - run: npx playwright install --with-deps webkit
      - name: iPad layout and source task
        run: npx playwright test tests/lesson-ninety-eight-ipad.spec.ts --workers=1

  certified:
    name: LESSON 98 CERTIFIED
    if: always()
    needs: [chromium-98, webkit-98]
    runs-on: ubuntu-latest
    steps:
      - name: Require Chromium and iPad lanes
        env:
          CHROMIUM_98: ${{ needs.chromium-98.result }}
          WEBKIT_98: ${{ needs.webkit-98.result }}
        run: |
          test "$CHROMIUM_98" = success
          test "$WEBKIT_98" = success
          echo "Lesson 98 source, flow, mandatory practice, Sulafat and iPad checks are certified."
