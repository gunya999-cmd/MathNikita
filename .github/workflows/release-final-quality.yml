name: Final quality certification

on:
  push:
    branches: [fix/release-gate-1-39-green4]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: final-quality-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-content:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: >-
          npx playwright test
          tests/course-plan.spec.ts
          tests/pedagogical-practice-quality.spec.ts
          tests/lesson-analytics-engagement.spec.ts
          tests/extended-practice-all-lessons.spec.ts
          tests/extended-practice-count.spec.ts
          --config=playwright.desktop.config.ts --workers=1

  accounts-cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run build
      - run: node scripts/cloud-api-smoke.mjs
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test tests/cloud-student-ui.spec.ts tests/cloud-sync-races.spec.ts tests/student-profiles.spec.ts --config=playwright.profile.config.ts --workers=1
      - run: npx playwright test tests/multi-student-cloud-isolation.spec.ts --config=playwright.profile.config.ts --workers=1
      - run: npx playwright test tests/multi-student-cloud-isolation.spec.ts --config=playwright.profile.ipad.config.ts --workers=1
      - run: npx playwright test tests/learner-dashboard.spec.ts --config=playwright.desktop.config.ts --workers=1

  full-voice:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx playwright install --with-deps chromium webkit
      - run: >-
          npx playwright test
          tests/voice-navigation-interruption.spec.ts
          tests/studio-voice-priority.spec.ts
          tests/lessons-one-to-five-every-stage-voice.spec.ts
          tests/lessons-one-to-four-pythagoras-voice.spec.ts
          tests/lessons-six-to-sixteen-every-stage-voice.spec.ts
          tests/lessons-six-to-sixteen-voice-sequencing.spec.ts
          tests/lessons-seventeen-to-twenty-three-every-stage-voice.spec.ts
          tests/lessons-seventeen-to-twenty-three-voice-sequencing.spec.ts
          tests/lesson-twenty-four-voice.spec.ts
          tests/lesson-twenty-five-voice.spec.ts
          tests/lesson-twenty-six-voice.spec.ts
          tests/lesson-twenty-seven-voice.spec.ts
          tests/lesson-thirty-four-voice.spec.ts
          tests/lesson-thirty-five-voice.spec.ts
          tests/lesson-thirty-six-voice.spec.ts
          tests/lesson-thirty-seven-voice.spec.ts
          tests/lesson-thirty-eight-voice.spec.ts
          tests/lesson-thirty-nine-voice.spec.ts
          --config=playwright.desktop.config.ts --workers=1
      - run: npx playwright test tests/voice-navigation-interruption.spec.ts --config=playwright.config.ts --workers=1
