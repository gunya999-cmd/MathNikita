name: Lesson 45 focused gate

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: lesson-45-focused-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  lesson45:
    name: Lesson 45 Chromium + iPad hard-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx playwright install --with-deps chromium webkit
      - name: Lesson 45 full flow on Chromium
        run: npx playwright test tests/lesson-forty-five-full-flow.spec.ts --config=playwright.desktop.config.ts --workers=1
      - name: Lesson 45 geometry and persistence on Chromium
        run: npx playwright test tests/lesson-forty-five-ipad.spec.ts --config=playwright.desktop.config.ts --workers=1
      - name: Lesson 45 geometry and persistence on iPad WebKit
        run: npx playwright test tests/lesson-forty-five-ipad.spec.ts --config=playwright.config.ts --workers=1
