name: Create production PIN pepper Worker secret

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/set-profile-pin-pepper.yml'

permissions:
  contents: read

jobs:
  set-secret:
    if: github.event_name == 'pull_request' && github.head_ref == 'ops/set-profile-pin-pepper'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
    steps:
      - name: Generate 256-bit pepper and store only as Cloudflare Worker Secret
        run: |
          set -eu
          openssl rand -hex 32 | npx -y wrangler@4.118.0 secret put PROFILE_PIN_PEPPER --name mathnikita
          echo 'PROFILE_PIN_PEPPER created in Cloudflare; secret value was not printed.'
