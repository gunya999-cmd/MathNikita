name: Create production PIN pepper Worker secret

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/set-profile-pin-pepper.yml'

permissions:
  contents: read

jobs:
  set-secret:
    if: github.event_name == 'pull_request' && github.head_ref == 'ops/set-profile-pin-pepper'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
    steps:
      - name: Generate 256-bit pepper and store only as Cloudflare Worker Secret
        run: |
          set -eu
          PEPPER="$(openssl rand -hex 32)"
          BODY="$(PEPPER="$PEPPER" node -e 'process.stdout.write(JSON.stringify({name:"PROFILE_PIN_PEPPER",text:process.env.PEPPER,type:"secret_text"}))')"
          status="$(curl -sS -o /tmp/secret-response.json -w '%{http_code}' -X PUT "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/mathnikita/secrets" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H 'Content-Type: application/json' --data "$BODY")"
          unset PEPPER BODY
          test "$status" = "200" || { echo "Cloudflare secret API returned HTTP $status"; exit 1; }
          node -e 'const fs=require("fs");const b=JSON.parse(fs.readFileSync("/tmp/secret-response.json","utf8"));if(!b.success)process.exit(1);console.log("PROFILE_PIN_PEPPER stored successfully; value was not printed.")'
