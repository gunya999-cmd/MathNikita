name: Lesson 95 certification

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: lesson-95-certification-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  chromium-95:
    name: Chromium · source, flow and Sulafat lesson 95
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Source and practice contract
        run: npx playwright test tests/lesson-ninety-five-data.spec.ts tests/lesson-ninety-five-player.spec.ts --config=playwright.desktop.config.ts --workers=1
      - name: Opening, navigation and mandatory practice flow
        run: npx playwright test tests/lesson-ninety-five-flow.spec.ts --config=playwright.desktop.config.ts --workers=1
      - name: Sulafat narration payload audit
        run: npx playwright test tests/lesson-ninety-five-voice.spec.ts --config=playwright.desktop.config.ts --workers=1

  webkit-95:
    name: iPad WebKit · lesson 95
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - run: npx playwright install --with-deps webkit
      - name: iPad layout and source task
        run: npx playwright test tests/lesson-ninety-five-ipad.spec.ts --workers=1

  certified:
    name: LESSON 95 CERTIFIED
    if: always()
    needs: [chromium-95, webkit-95]
    runs-on: ubuntu-latest
    steps:
      - name: Require Chromium and iPad lanes
        env:
          CHROMIUM_95: ${{ needs.chromium-95.result }}
          WEBKIT_95: ${{ needs.webkit-95.result }}
        run: |
          test "$CHROMIUM_95" = success
          test "$WEBKIT_95" = success
          echo "Lesson 95 source, flow, mandatory practice, Sulafat and iPad checks are certified."
