name: Voice auto-switch ready lessons hard test

on:
  workflow_dispatch:
  push:
    branches: [fix/voice-autoswitch-ready-lessons]
  pull_request:
    branches: [main]
    paths:
      - 'src/VoiceNarrator.tsx'
      - 'tests/voice-navigation-interruption.spec.ts'
      - '.github/workflows/voice-autoswitch-ready-lessons-hard.yml'

permissions:
  contents: read

concurrency:
  group: voice-autoswitch-ready-lessons-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build · voice auto-switch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run build

  chromium:
    name: Chromium · voice interruption 1-32
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/voice-navigation-interruption.spec.ts --config=playwright.desktop.config.ts --workers=1

  ipad:
    name: iPad WebKit · voice interruption 1-32
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx playwright install --with-deps webkit
      - run: npx playwright test tests/voice-navigation-interruption.spec.ts --config=playwright.config.ts --workers=1
