# Delta release gate for lesson 87. Keep PR checks focused on the changed lesson;
# cumulative course hard-certification is triggered once for the exact release SHA.
name: Course 1-87 certification

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: course-1-87-certification-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  chromium-87:
    name: Chromium · contract, practice, runtime and Sulafat 87
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Verify course boundary, pedagogy and lesson 87 source contract
        run: >-
          npx playwright test
          tests/course-plan.spec.ts
          tests/pedagogical-practice-quality.spec.ts
          tests/extended-practice-count.spec.ts
          tests/lesson-eighty-seven-source.spec.ts
          --config=playwright.desktop.config.ts --workers=1
      - name: Complete lesson 87 Chromium runtime
        run: npx playwright test tests/lesson-eighty-seven-full-flow.spec.ts tests/lesson-eighty-seven-ipad.spec.ts --config=playwright.desktop.config.ts --workers=1
      - name: Complete all 20 mandatory practice tasks / 50 responses
        run: npx playwright test tests/lesson-eighty-seven-practice.spec.ts --config=playwright.desktop.config.ts --workers=1
      - name: Verify Sulafat sequencing and interruption
        run: npx playwright test tests/lesson-eighty-seven-voice.spec.ts --config=playwright.desktop.config.ts --workers=1

  webkit-87:
    name: iPad WebKit runtime 87
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - run: npx playwright install --with-deps webkit
      - run: npx playwright test tests/lesson-eighty-seven-full-flow.spec.ts tests/lesson-eighty-seven-ipad.spec.ts --workers=1

  certified:
    name: COURSE 1-87 DELTA CERTIFIED
    if: always()
    needs: [chromium-87, webkit-87]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless both focused lesson 87 lanes passed
        env:
          CHROMIUM_87: ${{ needs.chromium-87.result }}
          WEBKIT_87: ${{ needs.webkit-87.result }}
        run: |
          test "$CHROMIUM_87" = success
          test "$WEBKIT_87" = success
          echo "Lesson 87 delta is certified."
