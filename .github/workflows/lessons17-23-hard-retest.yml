name: Lessons 17-23 hard retest

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/VoiceNarrator.tsx'
      - 'src/CatMentor.tsx'
      - 'src/PracticePythagoras.tsx'
      - 'src/ExtendedPracticeLab.tsx'
      - 'src/LessonCourseShell.tsx'
      - 'tests/lesson-seventeen-ipad.spec.ts'
      - 'tests/lesson-eighteen-ipad.spec.ts'
      - 'tests/lesson-nineteen-ipad.spec.ts'
      - 'tests/lesson-twenty-ipad.spec.ts'
      - 'tests/lesson-twenty-one-ipad.spec.ts'
      - 'tests/lesson-twenty-two-ipad.spec.ts'
      - 'tests/lesson-twenty-three-ipad.spec.ts'
      - 'tests/lessons-seventeen-to-twenty-three-*.spec.ts'
      - '.github/workflows/lessons17-23-hard-retest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-strict:
    name: Chromium · strict completion 17-23
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Complete lessons 17-23
        run: >-
          npx playwright test
          tests/lesson-seventeen-ipad.spec.ts
          tests/lesson-eighteen-ipad.spec.ts
          tests/lesson-nineteen-ipad.spec.ts
          tests/lesson-twenty-ipad.spec.ts
          tests/lesson-twenty-one-ipad.spec.ts
          tests/lesson-twenty-two-ipad.spec.ts
          tests/lesson-twenty-three-ipad.spec.ts
          --config=playwright.desktop.config.ts --workers=1
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lessons17-23-chromium-strict-${{ github.sha }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  webkit-strict:
    name: iPad WebKit · strict completion 17-23
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx playwright install --with-deps webkit
      - name: Complete lessons 17-23
        run: >-
          npx playwright test
          tests/lesson-seventeen-ipad.spec.ts
          tests/lesson-eighteen-ipad.spec.ts
          tests/lesson-nineteen-ipad.spec.ts
          tests/lesson-twenty-ipad.spec.ts
          tests/lesson-twenty-one-ipad.spec.ts
          tests/lesson-twenty-two-ipad.spec.ts
          tests/lesson-twenty-three-ipad.spec.ts
          --workers=1
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lessons17-23-webkit-strict-${{ github.sha }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  chromium-voice-runtime:
    name: Chromium · Sulafat + sequencing + Pythagoras 17-23
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Verify real studio playback and runtime
        run: >-
          npx playwright test
          tests/lessons-seventeen-to-twenty-three-every-stage-voice.spec.ts
          tests/lessons-seventeen-to-twenty-three-voice-sequencing.spec.ts
          tests/lessons-seventeen-to-twenty-three-runtime-and-pythagoras.spec.ts
          --config=playwright.desktop.config.ts --workers=1
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lessons17-23-chromium-voice-${{ github.sha }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  webkit-voice-runtime:
    name: iPad WebKit · Sulafat + sequencing + Pythagoras 17-23
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx playwright install --with-deps webkit
      - name: Verify real studio playback and runtime
        run: >-
          npx playwright test
          tests/lessons-seventeen-to-twenty-three-every-stage-voice.spec.ts
          tests/lessons-seventeen-to-twenty-three-voice-sequencing.spec.ts
          tests/lessons-seventeen-to-twenty-three-runtime-and-pythagoras.spec.ts
          --workers=1
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lessons17-23-webkit-voice-${{ github.sha }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
