name: Student dashboard certification

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/LearnerDashboard.tsx'
      - 'src/StudentDashboardV3.tsx'
      - 'src/StudentDashboardV4.tsx'
      - 'src/ParentDashboardV3.tsx'
      - 'src/studentDashboardV3.css'
      - 'src/studentDashboardV4.css'
      - 'src/adaptiveDashboard.css'
      - 'src/ReviewTrainer.tsx'
      - 'src/reviewTrainer.css'
      - 'src/studentReview.ts'
      - 'src/studentAnalytics.ts'
      - 'src/studentEconomy.ts'
      - 'src/PythagorasEconomy.tsx'
      - 'src/pythagorasEconomy.css'
      - 'src/LessonCourseShell.tsx'
      - 'src/dashboardKpi.ts'
      - 'src/App.tsx'
      - 'tests/learner-dashboard.spec.ts'
      - 'tests/learner-dashboard-ipad.spec.ts'
      - 'tests/adaptive-dashboard.spec.ts'
      - 'tests/student-economy.spec.ts'
      - '.github/workflows/student-dashboard.yml'
  push:
    branches: [main]
    paths:
      - 'src/LearnerDashboard.tsx'
      - 'src/StudentDashboardV3.tsx'
      - 'src/StudentDashboardV4.tsx'
      - 'src/ParentDashboardV3.tsx'
      - 'src/studentDashboardV3.css'
      - 'src/studentDashboardV4.css'
      - 'src/adaptiveDashboard.css'
      - 'src/ReviewTrainer.tsx'
      - 'src/reviewTrainer.css'
      - 'src/studentReview.ts'
      - 'src/studentAnalytics.ts'
      - 'src/studentEconomy.ts'
      - 'src/PythagorasEconomy.tsx'
      - 'src/pythagorasEconomy.css'
      - 'src/LessonCourseShell.tsx'
      - 'src/dashboardKpi.ts'
      - 'src/App.tsx'
      - 'tests/learner-dashboard.spec.ts'
      - 'tests/learner-dashboard-ipad.spec.ts'
      - 'tests/adaptive-dashboard.spec.ts'
      - 'tests/student-economy.spec.ts'
      - '.github/workflows/student-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    name: Student dashboard, adaptive review and economy regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Build application
        run: npm run build
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
      - name: Certify existing student dashboard and parent analytics in Chromium
        run: npx playwright test tests/learner-dashboard.spec.ts --config=playwright.desktop.config.ts --workers=1
      - name: Certify adaptive error review loop in Chromium
        run: npx playwright test tests/adaptive-dashboard.spec.ts --config=playwright.desktop.config.ts --workers=1
      - name: Certify Pythagoras economy in Chromium
        run: npx playwright test tests/student-economy.spec.ts --config=playwright.desktop.config.ts --workers=1
      - name: Certify student dashboard on iPad WebKit
        run: npx playwright test tests/learner-dashboard-ipad.spec.ts --workers=1
