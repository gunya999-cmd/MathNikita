name: Lesson 33 hard retest

on:
  workflow_dispatch:
  push:
    branches: [feat/lesson-33-control-2]
  pull_request:
    branches: [main]
    paths:
      - 'src/ControlWorkTwoPlayer.tsx'
      - 'src/LessonThirtyThreeOpening.ts'
      - 'src/LessonCourseShell.tsx'
      - 'src/CourseCatalog.tsx'
      - 'src/data/yearPlan.ts'
      - 'src/App.tsx'
      - 'tests/lesson-thirty-three-ipad.spec.ts'
      - 'tests/course-plan.spec.ts'
      - '.github/workflows/lesson-33-hard-retest.yml'

permissions:
  contents: read

concurrency:
  group: lesson-33-hard-retest-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build · lesson 33 control
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run build

  chromium:
    name: Chromium · lesson 33 full control and correction
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Lesson 33 control flow, persistence, scoring and correction
        run: npx playwright test tests/lesson-thirty-three-ipad.spec.ts --config=playwright.desktop.config.ts --workers=1
      - name: Course catalog regression
        run: npx playwright test tests/course-plan.spec.ts --config=playwright.desktop.config.ts --workers=1
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lesson-33-chromium-${{ github.sha }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  ipad:
    name: iPad WebKit · lesson 33 full control and correction
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx playwright install --with-deps webkit
      - name: Lesson 33 responsive control flow
        run: npx playwright test tests/lesson-thirty-three-ipad.spec.ts --config=playwright.config.ts --workers=1
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lesson-33-ipad-${{ github.sha }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
