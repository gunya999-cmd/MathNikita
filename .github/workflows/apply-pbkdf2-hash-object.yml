name: Apply PBKDF2 SHA-256 algorithm object fix

on:
  push:
    branches:
      - fix/pbkdf2-hash-object
    paths:
      - '.github/workflows/apply-pbkdf2-hash-object.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pbkdf2-hash-object
      - name: Replace PBKDF2 hash string with algorithm object
        run: |
          node <<'NODE'
          const fs=require('fs');
          const path='worker/cloudProfiles.ts';
          let source=fs.readFileSync(path,'utf8');
          const before="hash:'SHA-256'";
          const after="hash:{name:'SHA-256'}";
          if(!source.includes(before))throw new Error('Expected PBKDF2 hash expression was not found');
          source=source.replace(before,after);
          fs.writeFileSync(path,source);
          NODE
      - name: Remove one-shot workflow and commit product fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/apply-pbkdf2-hash-object.yml
          git add worker/cloudProfiles.ts
          git commit -m "Use SHA-256 algorithm object for PBKDF2 derivation"
          git push origin HEAD:fix/pbkdf2-hash-object
