name: Lesson 120 certification

on:
  workflow_dispatch:
  push:
    branches: [lesson-120-build]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: lesson-120-certification-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  chromium-120:
    name: Chromium · source, flow and Sulafat lesson 120
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Source, player and course-boundary contract
        run: npx playwright test tests/lesson-one-hundred-twenty-data.spec.ts tests/lesson-one-hundred-twenty-player.spec.ts tests/course-plan.spec.ts --config=playwright.desktop.config.ts --workers=1
      - name: Opening, navigation and exact §33 practice flow
        run: npx playwright test tests/lesson-one-hundred-twenty-flow.spec.ts --config=playwright.desktop.config.ts --workers=1
      - name: Sulafat narration payload audit
        run: npx playwright test tests/lesson-one-hundred-twenty-voice.spec.ts --config=playwright.desktop.config.ts --workers=1

  webkit-120:
    name: iPad WebKit · lesson 120
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - run: npx playwright install --with-deps webkit
      - name: iPad layout and first exact subtraction-rule task
        run: npx playwright test tests/lesson-one-hundred-twenty-ipad.spec.ts --workers=1

  certified:
    name: LESSON 120 CERTIFIED
    if: always()
    needs: [chromium-120, webkit-120]
    runs-on: ubuntu-latest
    steps:
      - name: Require Chromium and iPad lanes
        env:
          CHROMIUM_120: ${{ needs.chromium-120.result }}
          WEBKIT_120: ${{ needs.webkit-120.result }}
        run: |
          test "$CHROMIUM_120" = success
          test "$WEBKIT_120" = success
          echo "Lesson 120 §33 source, decimal subtraction, 20/50 practice, Sulafat and iPad checks are certified."
