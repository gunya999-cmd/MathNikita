name: Lesson 39 hard retest

on:
  push:
    branches: [feat/lesson-39-angle-measurement]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lesson-39-hard-retest
  cancel-in-progress: true

env:
  PRACTICE_START: 39
  PRACTICE_END: 39

jobs:
  build:
    name: Build + pedagogical quality · lesson 39
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - run: npm run build
      - run: npx playwright test tests/pedagogical-practice-quality.spec.ts tests/extended-practice-count.spec.ts --config=playwright.desktop.config.ts --workers=1

  chromium:
    name: Chromium · lesson 39 full flow, voice and 20-task practice
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/lesson-thirty-nine-full-flow.spec.ts tests/lesson-thirty-nine-ipad.spec.ts tests/lesson-thirty-nine-voice.spec.ts tests/extended-practice-all-lessons.spec.ts tests/course-plan.spec.ts --config=playwright.desktop.config.ts --workers=1

  webkit:
    name: iPad WebKit · lesson 39 full flow, voice and 20-task practice
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - run: npx playwright install --with-deps webkit
      - run: npx playwright test tests/lesson-thirty-nine-full-flow.spec.ts tests/lesson-thirty-nine-ipad.spec.ts tests/lesson-thirty-nine-voice.spec.ts tests/extended-practice-all-lessons.spec.ts tests/course-plan.spec.ts --config=playwright.config.ts --workers=1
