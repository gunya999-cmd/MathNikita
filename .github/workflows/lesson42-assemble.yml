name: Lesson 42 integration

on:
  push:
    branches:
      - feature/lesson-42-angle-problems

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.head_commit.message != 'Integrate lesson 42 into course'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/lesson-42-angle-problems
          fetch-depth: 0
      - name: Integrate lesson 42
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_exact(path, old, new, expected=1):
              p=Path(path); s=p.read_text()
              count=s.count(old)
              if count!=expected:
                  raise SystemExit(f'{path}: expected {expected} occurrences of {old!r}, found {count}')
              p.write_text(s.replace(old,new))

          replace_exact('src/data/yearPlan.ts','available:segment.from+offset<=41','available:segment.from+offset<=42')

          replace_exact('src/LessonCourseShell.tsx',
              "import { CompositeAnglePracticePlayer } from './CompositeAnglePracticePlayer';",
              "import { CompositeAnglePracticePlayer } from './CompositeAnglePracticePlayer';import { OverlappingAngleProblemsPlayer } from './OverlappingAngleProblemsPlayer';")
          replace_exact('src/LessonCourseShell.tsx',
              "import { lessonFortyOneOpening } from './LessonFortyOneOpening';",
              "import { lessonFortyOneOpening } from './LessonFortyOneOpening';import { lessonFortyTwoOpening } from './LessonFortyTwoOpening';")
          replace_exact('src/LessonCourseShell.tsx','Array.from({length:41},(_,i)=>i+1)','Array.from({length:42},(_,i)=>i+1)')
          replace_exact('src/LessonCourseShell.tsx','lessonFortyOpening,lessonFortyOneOpening];','lessonFortyOpening,lessonFortyOneOpening,lessonFortyTwoOpening];')
          replace_exact('src/LessonCourseShell.tsx',
              'const runtime=selectedLesson===41?<CompositeAnglePracticePlayer key="lesson-41"/>:',
              'const runtime=selectedLesson===42?<OverlappingAngleProblemsPlayer key="lesson-42"/>:selectedLesson===41?<CompositeAnglePracticePlayer key="lesson-41"/>:')

          replace_exact('src/CourseCatalog.tsx',
              "41:'Закрепление § 12: составные углы, сумма соседних частей, неизвестная градусная мера, прямой угол 90°, развёрнутый угол 180°, несколько лучей и проверка вычислений.'};",
              "41:'Закрепление § 12: составные углы, сумма соседних частей, неизвестная градусная мера, прямой угол 90°, развёрнутый угол 180°, несколько лучей и проверка вычислений.',42:'Закрепление § 12: геометрические задачи на перекрывающиеся углы, прямой и развёрнутый угол, проверка гипотез, контрпримеры и углы между стрелками часов.'};")
          replace_exact('src/CourseCatalog.tsx',
              'Полностью готов 41 интерактивный урок. Остальные сохранены в точной последовательности учебного года.',
              'Полностью готовы 42 урока. Остальные сохранены в точной последовательности учебного года.')

          replace_exact('src/data/extendedPracticeData.ts',
              "import { extendedPracticeLesson41 } from './extendedPracticeLesson41';",
              "import { extendedPracticeLesson41 } from './extendedPracticeLesson41';\nimport { extendedPracticeLesson42 } from './extendedPracticeLesson42';")
          replace_exact('src/data/extendedPracticeData.ts',
              '40:extendedPracticeLesson40,41:extendedPracticeLesson41};',
              '40:extendedPracticeLesson40,41:extendedPracticeLesson41,42:extendedPracticeLesson42};')
          replace_exact('src/data/extendedPracticeData.ts',
              '39:[],40:[],41:[]};',
              '39:[],40:[],41:[],42:[]};')

          replace_exact('tests/course-plan.spec.ts',
              "test('catalog follows the official 175-lesson Merzlyak plan through lesson 41'",
              "test('catalog follows the official 175-lesson Merzlyak plan through lesson 42'")
          replace_exact('tests/course-plan.spec.ts',
              "await expect(page.locator('.course-lesson-grid > button.is-interactive')).toHaveCount(39);",
              "await expect(page.locator('.course-lesson-grid > button.is-interactive')).toHaveCount(40);")
          replace_exact('tests/course-plan.spec.ts',
              "await expect(page.locator('.course-lesson-grid > button:not([disabled])')).toHaveCount(41);",
              "await expect(page.locator('.course-lesson-grid > button:not([disabled])')).toHaveCount(42);")
          replace_exact('tests/course-plan.spec.ts',
              "  await expect(lessons.nth(41)).toContainText('Виды углов. Измерение углов');\n  await expect(lessons.nth(41)).toBeDisabled();",
              "  await expect(lessons.nth(41)).toContainText('Виды углов. Измерение углов');\n  await expect(lessons.nth(41)).toBeEnabled();\n  await expect(lessons.nth(41)).toHaveClass(/is-interactive/);\n  await expect(lessons.nth(42)).toContainText('Виды углов. Измерение углов');\n  await expect(lessons.nth(42)).toBeDisabled();")
          replace_exact('tests/course-plan.spec.ts',
              "await expect(page.getByText('Полностью готов 41 интерактивный урок.')).toBeVisible();",
              "await expect(page.getByText('Полностью готовы 42 урока.')).toBeVisible();")

          replace_exact('tests/extended-practice-all-lessons.spec.ts','40:36,41:36};','40:36,41:36,42:36};')
          replace_exact('tests/extended-practice-count.spec.ts','lessonNumber<=41','lessonNumber<=42')
          replace_exact('tests/pedagogical-practice-quality.spec.ts','lessonNumber<=41','lessonNumber<=42')

          replace_exact('tests/lesson-forty-ipad.spec.ts',
              "  const lesson42=page.locator('.course-lesson-grid > button').nth(41);\n  await expect(lesson40).toBeVisible();await expect(lesson40).toBeEnabled();await expect(lesson41).toBeEnabled();await expect(lesson42).toBeDisabled();",
              "  const lesson42=page.getByRole('button',{name:/Открыть урок 42:/});\n  const lesson43=page.locator('.course-lesson-grid > button').nth(42);\n  await expect(lesson40).toBeVisible();await expect(lesson40).toBeEnabled();await expect(lesson41).toBeEnabled();await expect(lesson42).toBeEnabled();await expect(lesson43).toBeDisabled();")
          replace_exact('tests/lesson-forty-one-ipad.spec.ts',
              "async function openLesson41(page:Page){await page.goto('/');const chapterTwo=page.locator('.course-chapter-group').nth(1);if(!(await chapterTwo.evaluate(element=>(element as HTMLDetailsElement).open)))await chapterTwo.locator('summary').click();const lesson41=page.getByRole('button',{name:/Открыть урок 41:/});const lesson42=page.locator('.course-lesson-grid > button').nth(41);await expect(lesson41).toBeVisible();await expect(lesson41).toBeEnabled();await expect(lesson42).toBeDisabled();await lesson41.click();",
              "async function openLesson41(page:Page){await page.goto('/');const chapterTwo=page.locator('.course-chapter-group').nth(1);if(!(await chapterTwo.evaluate(element=>(element as HTMLDetailsElement).open)))await chapterTwo.locator('summary').click();const lesson41=page.getByRole('button',{name:/Открыть урок 41:/});const lesson42=page.getByRole('button',{name:/Открыть урок 42:/});const lesson43=page.locator('.course-lesson-grid > button').nth(42);await expect(lesson41).toBeVisible();await expect(lesson41).toBeEnabled();await expect(lesson42).toBeEnabled();await expect(lesson43).toBeDisabled();await lesson41.click();")

          old=Path('.github/workflows/course-1-41-certification.yml')
          new=Path('.github/workflows/course-1-42-certification.yml')
          wf=old.read_text()
          wf=wf.replace('Course 1-41','Course 1-42').replace('course-1-41','course-1-42')
          wf=wf.replace('1-41','1-42').replace('28-41','28-42').replace('28_41','28_42')
          wf=wf.replace('Complete all 20 lesson 41 practice tasks with Sulafat and persistence','Complete all 20 lesson 42 practice tasks with Sulafat and persistence')
          wf=wf.replace('PRACTICE_START: 41','PRACTICE_START: 42').replace('PRACTICE_END: 41','PRACTICE_END: 42')
          marker='          tests/lesson-forty-one-ipad.spec.ts\n          --config=playwright.desktop.config.ts --workers=1'
          if wf.count(marker)!=1: raise SystemExit(f'workflow chromium marker count={wf.count(marker)}')
          wf=wf.replace(marker,'          tests/lesson-forty-one-ipad.spec.ts\n          tests/lesson-forty-two-full-flow.spec.ts\n          tests/lesson-forty-two-ipad.spec.ts\n          --config=playwright.desktop.config.ts --workers=1')
          marker='          tests/lesson-forty-one-ipad.spec.ts\n          --workers=1'
          if wf.count(marker)!=1: raise SystemExit(f'workflow webkit marker count={wf.count(marker)}')
          wf=wf.replace(marker,'          tests/lesson-forty-one-ipad.spec.ts\n          tests/lesson-forty-two-full-flow.spec.ts\n          tests/lesson-forty-two-ipad.spec.ts\n          --workers=1')
          marker='          tests/lesson-forty-one-voice.spec.ts\n          --config=playwright.desktop.config.ts --workers=1'
          if wf.count(marker)!=1: raise SystemExit(f'workflow voice marker count={wf.count(marker)}')
          wf=wf.replace(marker,'          tests/lesson-forty-one-voice.spec.ts\n          tests/lesson-forty-two-voice.spec.ts\n          --config=playwright.desktop.config.ts --workers=1')
          if 'tests/voice-navigation-interruption.spec.ts tests/lesson-forty-one-voice.spec.ts --config=playwright.config.ts' not in wf:
              raise SystemExit('workflow WebKit voice marker missing')
          wf=wf.replace('tests/voice-navigation-interruption.spec.ts tests/lesson-forty-one-voice.spec.ts --config=playwright.config.ts',
                        'tests/voice-navigation-interruption.spec.ts tests/lesson-forty-two-voice.spec.ts --config=playwright.config.ts')
          wf=wf.replace('timeout-minutes: 30','timeout-minutes: 32',1)
          wf=wf.replace('timeout-minutes: 36','timeout-minutes: 38',1)
          webkit_marker='  webkit-28-42:\n    name: iPad WebKit runtime 28-42\n    runs-on: ubuntu-latest\n    timeout-minutes: 38'
          if webkit_marker not in wf: raise SystemExit('webkit timeout marker missing')
          wf=wf.replace(webkit_marker,webkit_marker.replace('timeout-minutes: 38','timeout-minutes: 40'),1)
          wf=wf.replace('timeout-minutes: 44','timeout-minutes: 46',1)
          new.write_text(wf)
          old.unlink()

          p=Path('src/OverlappingAngleProblemsPlayer.tsx').read_text()
          if len(re.findall(r"^\s*\{id:'l42-",p,re.M))!=36: raise SystemExit('lesson42 must have exactly 36 stages')
          e=Path('src/data/extendedPracticeLesson42.ts').read_text()
          if len(set(re.findall(r"l42-extra-\d{2}",e)))!=20: raise SystemExit('lesson42 mandatory practice must have exactly 20 unique ids')
          for path in ['tests/lesson-forty-two-full-flow.spec.ts','tests/lesson-forty-two-ipad.spec.ts','tests/lesson-forty-two-voice.spec.ts']:
              if not Path(path).exists(): raise SystemExit(f'missing {path}')
          if 'lessonFortyTwoOpening' not in Path('src/LessonCourseShell.tsx').read_text(): raise SystemExit('opening integration missing')
          if 'selectedLesson===42?<OverlappingAngleProblemsPlayer' not in Path('src/LessonCourseShell.tsx').read_text(): raise SystemExit('runtime integration missing')
          if 'available:segment.from+offset<=42' not in Path('src/data/yearPlan.ts').read_text(): raise SystemExit('lesson42 availability missing')
          if Path('.github/workflows/course-1-41-certification.yml').exists(): raise SystemExit('old certification workflow still exists')
          if not Path('.github/workflows/course-1-42-certification.yml').exists(): raise SystemExit('new certification workflow missing')
          print('Lesson 42 integration complete: 36 stages, 20 mandatory tasks, Course 1-42')

          PY
      - name: Commit integrated course
        run: |
          rm .github/workflows/lesson42-assemble.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate lesson 42 into course"
          git push origin HEAD:feature/lesson-42-angle-problems
