name: Lesson 109 certification

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: lesson-109-certification-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  chromium-109:
    name: Chromium · source, flow and Sulafat lesson 109
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Source, player and course-boundary contract
        run: npx playwright test tests/lesson-one-hundred-nine-data.spec.ts tests/lesson-one-hundred-nine-player.spec.ts tests/course-plan.spec.ts --config=playwright.desktop.config.ts --workers=1
      - name: Opening, navigation and exact §30 practice flow
        run: npx playwright test tests/lesson-one-hundred-nine-flow.spec.ts --config=playwright.desktop.config.ts --workers=1
      - name: Sulafat narration payload audit
        run: npx playwright test tests/lesson-one-hundred-nine-voice.spec.ts --config=playwright.desktop.config.ts --workers=1

  webkit-109:
    name: iPad WebKit · lesson 109
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - run: npx playwright install --with-deps webkit
      - name: iPad layout and exact source task
        run: npx playwright test tests/lesson-one-hundred-nine-ipad.spec.ts --workers=1

  certified:
    name: LESSON 109 CERTIFIED
    if: always()
    needs: [chromium-109, webkit-109]
    runs-on: ubuntu-latest
    steps:
      - name: Require Chromium and iPad lanes
        env:
          CHROMIUM_109: ${{ needs.chromium-109.result }}
          WEBKIT_109: ${{ needs.webkit-109.result }}
        run: |
          test "$CHROMIUM_109" = success
          test "$WEBKIT_109" = success
          echo "Lesson 109 §30 source, flow, boundary, 20/50 practice, Sulafat and iPad checks are certified."
