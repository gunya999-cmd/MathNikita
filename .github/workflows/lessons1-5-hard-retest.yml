name: Lessons 1-5 hard retest

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/VoiceNarrator.tsx'
      - 'src/CatMentor.tsx'
      - 'src/PracticePythagoras.tsx'
      - 'src/ExtendedPracticeLab.tsx'
      - 'src/LessonCourseShell.tsx'
      - 'tests/lessons-one-to-five-*.spec.ts'
      - 'tests/lessons-one-to-four-*.spec.ts'
      - '.github/workflows/lessons1-5-hard-retest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-voice:
    name: Chromium · Sulafat + Pythagoras 1-5
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Verify actual Sulafat playback on every stage and Practice Pythagoras
        run: >-
          npx playwright test
          tests/lessons-one-to-five-every-stage-voice.spec.ts
          tests/lessons-one-to-four-pythagoras-voice.spec.ts
          --config=playwright.desktop.config.ts --workers=1
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lessons1-5-chromium-voice-${{ github.sha }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  webkit-voice:
    name: iPad WebKit · Sulafat + Pythagoras 1-5
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx playwright install --with-deps webkit
      - name: Verify actual Sulafat playback on every stage and Practice Pythagoras
        run: >-
          npx playwright test
          tests/lessons-one-to-five-every-stage-voice.spec.ts
          tests/lessons-one-to-four-pythagoras-voice.spec.ts
          --workers=1
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lessons1-5-webkit-voice-${{ github.sha }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
