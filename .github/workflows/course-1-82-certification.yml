# Delta release gate for lesson 82. Earlier certification workflows continue to protect prior lessons.
name: Course 1-82 certification

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: course-1-82-certification-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-content:
    name: Build + content + pedagogy through 82
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: >-
          npx playwright test
          tests/course-plan.spec.ts
          tests/pedagogical-practice-quality.spec.ts
          tests/extended-practice-count.spec.ts
          tests/lesson-eighty-two-source.spec.ts
          tests/lesson-eighty-two-full-flow.spec.ts
          --config=playwright.desktop.config.ts --workers=1
      - name: Complete all 20 mandatory practice tasks / 50 responses for lesson 82
        run: npx playwright test tests/lesson-eighty-two-practice.spec.ts --config=playwright.desktop.config.ts --workers=1

  chromium-82:
    name: Chromium runtime 82
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/lesson-eighty-two-full-flow.spec.ts tests/lesson-eighty-two-ipad.spec.ts --config=playwright.desktop.config.ts --workers=1

  webkit-82:
    name: iPad WebKit runtime 82
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx playwright install --with-deps webkit
      - run: npx playwright test tests/lesson-eighty-two-full-flow.spec.ts tests/lesson-eighty-two-ipad.spec.ts --workers=1

  voice-82:
    name: Sulafat voice + interruption 82
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/lesson-eighty-two-voice.spec.ts --config=playwright.desktop.config.ts --workers=1

  certified:
    name: COURSE 1-82 DELTA CERTIFIED
    if: always()
    needs: [build-content, chromium-82, webkit-82, voice-82]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every lesson 82 release lane passed
        env:
          BUILD_CONTENT: ${{ needs.build-content.result }}
          CHROMIUM_82: ${{ needs.chromium-82.result }}
          WEBKIT_82: ${{ needs.webkit-82.result }}
          VOICE_82: ${{ needs.voice-82.result }}
        run: |
          test "$BUILD_CONTENT" = success
          test "$CHROMIUM_82" = success
          test "$WEBKIT_82" = success
          test "$VOICE_82" = success
          echo "Lesson 82 delta is certified."
