name: Lesson 112 certification

on:
  workflow_dispatch:
  push:
    branches: [lesson-112-build]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: lesson-112-certification-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  chromium-112:
    name: Chromium · source, flow and Sulafat lesson 112
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Source, player and course-boundary contract
        run: npx playwright test tests/lesson-one-hundred-twelve-data.spec.ts tests/lesson-one-hundred-twelve-player.spec.ts tests/course-plan.spec.ts --config=playwright.desktop.config.ts --workers=1
      - name: Opening, navigation and exact §30 practice flow
        run: npx playwright test tests/lesson-one-hundred-twelve-flow.spec.ts --config=playwright.desktop.config.ts --workers=1
      - name: Sulafat narration payload audit
        run: npx playwright test tests/lesson-one-hundred-twelve-voice.spec.ts --config=playwright.desktop.config.ts --workers=1

  webkit-112:
    name: iPad WebKit · lesson 112
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - run: npx playwright install --with-deps webkit
      - name: iPad layout and coordinate-ray source task
        run: npx playwright test tests/lesson-one-hundred-twelve-ipad.spec.ts --workers=1

  certified:
    name: LESSON 112 CERTIFIED
    if: always()
    needs: [chromium-112, webkit-112]
    runs-on: ubuntu-latest
    steps:
      - name: Require Chromium and iPad lanes
        env:
          CHROMIUM_112: ${{ needs.chromium-112.result }}
          WEBKIT_112: ${{ needs.webkit-112.result }}
        run: |
          test "$CHROMIUM_112" = success
          test "$WEBKIT_112" = success
          echo "Lesson 112 §30 source, flow, boundary, 20/50 practice, Sulafat and iPad checks are certified."
