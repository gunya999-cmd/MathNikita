name: Lesson 46 geometry hardening
on:
  push:
    branches: [agent/lesson-46-triangle-types]
permissions:
  contents: write
jobs:
  harden:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lesson-46-triangle-types
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Make SVG classifications geometrically true
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/TriangleTypesPlayer.tsx'); t=p.read_text()
          replacements={
            "points:'105,240 105,70 300,240',angle:'right',side:'isosceles'":"points:'120,240 120,70 290,240',angle:'right',side:'isosceles'",
            "points:'85,235 300,60 515,235',angle:'acute',side:'equilateral'":"points:'170,245 300,20 430,245',angle:'acute',side:'equilateral'",
            "points:'75,235 255,55 535,210',angle:'acute',side:'scalene'":"points:'100,240 280,30 500,240',angle:'acute',side:'scalene'",
            "points:'75,235 285,55 525,230',angle:'acute',side:'scalene'":"points:'100,240 280,30 500,240',angle:'acute',side:'scalene'",
            "kind==='right'?'M94 150 L116 150'":"kind==='right'?'M109 150 L131 150'",
            "kind==='right'?'M190 229 L190 251'":"kind==='right'?'M205 229 L205 251'"
          }
          for old,new in replacements.items():
              if old not in t and new not in t: raise SystemExit(f'missing source geometry pattern: {old}')
              t=t.replace(old,new)
          p.write_text(t)

          p=Path('tests/lesson-forty-six-ipad.spec.ts'); t=p.read_text()
          anchor="await expect(right.locator('[data-right-angle-marker=\"true\"]')).toHaveCount(1);const marker=await right.locator('[data-right-angle-marker=\"true\"]').getAttribute('d');expect(marker).toContain('L130 215');"
          replacement="await expect(right.locator('[data-right-angle-marker=\"true\"]')).toHaveCount(1);const geometry=async(scope:any)=>scope.locator('polygon.triangle-shape').evaluate((node:SVGPolygonElement)=>{const pts=(node.getAttribute('points')??'').trim().split(/\\s+/).map(pair=>pair.split(',').map(Number));const d=(a:number[],b:number[])=>Math.hypot(a[0]-b[0],a[1]-b[1]);const dot=(o:number[],a:number[],b:number[])=>(a[0]-o[0])*(b[0]-o[0])+(a[1]-o[1])*(b[1]-o[1]);return{ab:d(pts[0],pts[1]),bc:d(pts[1],pts[2]),ca:d(pts[2],pts[0]),dotA:dot(pts[0],pts[1],pts[2]),dotB:dot(pts[1],pts[0],pts[2]),dotC:dot(pts[2],pts[0],pts[1])}});const rightGeo=await geometry(right);expect(Math.abs(rightGeo.ab-rightGeo.ca)).toBeLessThan(0.01);expect(Math.abs(rightGeo.dotA)).toBeLessThan(0.01);"
          if anchor not in t and replacement not in t: raise SystemExit('right geometry test anchor missing')
          t=t.replace(anchor,replacement)
          anchor2="await expect(equi.locator('[data-equal-side-mark]')).toHaveCount(3);"
          replacement2="await expect(equi.locator('[data-equal-side-mark]')).toHaveCount(3);const equiGeo=await geometry(equi);expect(Math.max(equiGeo.ab,equiGeo.bc,equiGeo.ca)-Math.min(equiGeo.ab,equiGeo.bc,equiGeo.ca)).toBeLessThan(1);await jump(page,11,'l46-scalene-model');const scalene=page.locator('[data-stage-id=\"l46-scalene-model\"] .triangle-lesson-diagram');const scaleneGeo=await geometry(scalene);expect(new Set([Math.round(scaleneGeo.ab),Math.round(scaleneGeo.bc),Math.round(scaleneGeo.ca)]).size).toBe(3);expect(scaleneGeo.dotA).toBeGreaterThan(0);expect(scaleneGeo.dotB).toBeGreaterThan(0);expect(scaleneGeo.dotC).toBeGreaterThan(0);"
          if anchor2 not in t and replacement2 not in t: raise SystemExit('equilateral geometry test anchor missing')
          t=t.replace(anchor2,replacement2)
          p.write_text(t)
          PY
      - name: Verify real geometry in Chromium and WebKit
        run: |
          npm install
          npm run build
          npx playwright install --with-deps chromium webkit
          npx playwright test tests/lesson-forty-six-full-flow.spec.ts tests/lesson-forty-six-ipad.spec.ts --config=playwright.desktop.config.ts --workers=1
          npx playwright test tests/lesson-forty-six-ipad.spec.ts --config=playwright.config.ts --workers=1
      - name: Commit geometry hardening
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/TriangleTypesPlayer.tsx tests/lesson-forty-six-ipad.spec.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Harden lesson 46 triangle geometry'
          git push origin HEAD:agent/lesson-46-triangle-types
