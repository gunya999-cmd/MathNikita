name: Lesson 96 certification

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: lesson-96-certification-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  chromium-96:
    name: Chromium · source, flow and Sulafat lesson 96
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Source and practice contract
        run: npx playwright test tests/lesson-ninety-six-data.spec.ts tests/lesson-ninety-six-player.spec.ts --config=playwright.desktop.config.ts --workers=1
      - name: Opening, navigation and mandatory practice flow
        run: npx playwright test tests/lesson-ninety-six-flow.spec.ts --config=playwright.desktop.config.ts --workers=1
      - name: Sulafat narration payload audit
        run: npx playwright test tests/lesson-ninety-six-voice.spec.ts --config=playwright.desktop.config.ts --workers=1

  webkit-96:
    name: iPad WebKit · lesson 96
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - run: npx playwright install --with-deps webkit
      - name: iPad layout and source task
        run: npx playwright test tests/lesson-ninety-six-ipad.spec.ts --workers=1

  certified:
    name: LESSON 96 CERTIFIED
    if: always()
    needs: [chromium-96, webkit-96]
    runs-on: ubuntu-latest
    steps:
      - name: Require Chromium and iPad lanes
        env:
          CHROMIUM_96: ${{ needs.chromium-96.result }}
          WEBKIT_96: ${{ needs.webkit-96.result }}
        run: |
          test "$CHROMIUM_96" = success
          test "$WEBKIT_96" = success
          echo "Lesson 96 source, flow, mandatory practice, Sulafat and iPad checks are certified."
