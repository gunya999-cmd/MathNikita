# Delta release gate for lesson 70. Earlier certification workflows continue to protect prior lessons.
name: Course 1-70 certification

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: course-1-70-certification-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-content:
    name: Build + content + pedagogy through 70
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: >-
          npx playwright test
          tests/course-plan.spec.ts
          tests/pedagogical-practice-quality.spec.ts
          tests/extended-practice-count.spec.ts
          tests/lesson-seventy-source.spec.ts
          tests/lesson-seventy-full-flow.spec.ts
          --config=playwright.desktop.config.ts --workers=1
      - name: Complete all 20 mandatory practice tasks / 50 responses for lesson 70
        run: npx playwright test tests/lesson-seventy-practice.spec.ts --config=playwright.desktop.config.ts --workers=1

  chromium-70:
    name: Chromium runtime 70
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/lesson-seventy-full-flow.spec.ts tests/lesson-seventy-ipad.spec.ts --config=playwright.desktop.config.ts --workers=1

  webkit-70:
    name: iPad WebKit runtime 70
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx playwright install --with-deps webkit
      - run: npx playwright test tests/lesson-seventy-full-flow.spec.ts tests/lesson-seventy-ipad.spec.ts --workers=1

  voice-70:
    name: Sulafat voice + interruption 70
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/lesson-seventy-voice.spec.ts --config=playwright.desktop.config.ts --workers=1

  certified:
    name: COURSE 1-70 DELTA CERTIFIED
    if: always()
    needs: [build-content, chromium-70, webkit-70, voice-70]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every lesson 70 release lane passed
        env:
          BUILD_CONTENT: ${{ needs.build-content.result }}
          CHROMIUM_70: ${{ needs.chromium-70.result }}
          WEBKIT_70: ${{ needs.webkit-70.result }}
          VOICE_70: ${{ needs.voice-70.result }}
        run: |
          test "$BUILD_CONTENT" = success
          test "$CHROMIUM_70" = success
          test "$WEBKIT_70" = success
          test "$VOICE_70" = success
          echo "Lesson 70 delta is certified."
