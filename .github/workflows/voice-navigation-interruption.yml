name: Voice navigation interruption

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/LessonCourseShell.tsx'
      - 'src/VoiceNarrator.tsx'
      - 'src/ExtendedPracticeLab.tsx'
      - 'src/PracticePythagoras.tsx'
      - 'src/CatMentor.tsx'
      - 'tests/voice-navigation-interruption.spec.ts'
      - '.github/workflows/voice-navigation-interruption.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interrupt-hard-test:
    name: ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Chromium · immediate narration handoff
            browser: chromium
            config: playwright.desktop.config.ts
          - label: iPad WebKit · immediate narration handoff
            browser: webkit
            config: playwright.config.ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Old voice must stop before the next context speaks
        run: npx playwright test tests/voice-navigation-interruption.spec.ts --config=${{ matrix.config }} --workers=1
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: voice-navigation-interruption-${{ matrix.browser }}-${{ github.sha }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
