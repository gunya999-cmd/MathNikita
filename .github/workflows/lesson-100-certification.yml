name: Lesson 100 certification

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: lesson-100-certification-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  chromium-100:
    name: Chromium · source, flow and Sulafat lesson 100
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Source, player and course-boundary contract
        run: npx playwright test tests/lesson-one-hundred-data.spec.ts tests/lesson-one-hundred-player.spec.ts tests/course-plan.spec.ts --config=playwright.desktop.config.ts --workers=1
      - name: Opening, navigation and mandatory practice flow
        run: npx playwright test tests/lesson-one-hundred-flow.spec.ts --config=playwright.desktop.config.ts --workers=1
      - name: Sulafat narration payload audit
        run: npx playwright test tests/lesson-one-hundred-voice.spec.ts --config=playwright.desktop.config.ts --workers=1

  webkit-100:
    name: iPad WebKit · lesson 100
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - run: npx playwright install --with-deps webkit
      - name: iPad layout and exact source task
        run: npx playwright test tests/lesson-one-hundred-ipad.spec.ts --workers=1

  certified:
    name: LESSON 100 CERTIFIED
    if: always()
    needs: [chromium-100, webkit-100]
    runs-on: ubuntu-latest
    steps:
      - name: Require Chromium and iPad lanes
        env:
          CHROMIUM_100: ${{ needs.chromium-100.result }}
          WEBKIT_100: ${{ needs.webkit-100.result }}
        run: |
          test "$CHROMIUM_100" = success
          test "$WEBKIT_100" = success
          echo "Lesson 100 source, flow, boundary, mandatory practice, Sulafat and iPad checks are certified."
