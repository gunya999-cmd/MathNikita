name: Lesson 9 audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/GeometrySummaryPlayer.tsx'
      - 'src/CatMentor.tsx'
      - 'src/data/lessonNineMentorScripts.json'
      - 'src/data/extendedPracticeLesson9.ts'
      - 'src/data/lessonNineMastery.ts'
      - 'src/data/extendedPracticeData.ts'
      - 'src/extendedPracticeEngine.ts'
      - 'src/ExtendedPracticeLab.tsx'
      - 'src/LessonReflection.tsx'
      - 'src/PracticePythagoras.tsx'
      - 'src/VoiceNarrator.tsx'
      - 'tests/lesson-nine-audit.spec.ts'
      - '.github/workflows/lesson9-audit.yml'
  push:
    branches: [main]
    paths:
      - 'src/GeometrySummaryPlayer.tsx'
      - 'src/CatMentor.tsx'
      - 'src/data/lessonNineMentorScripts.json'
      - 'src/data/extendedPracticeLesson9.ts'
      - 'src/data/lessonNineMastery.ts'
      - 'src/data/extendedPracticeData.ts'
      - 'src/extendedPracticeEngine.ts'
      - 'src/ExtendedPracticeLab.tsx'
      - 'tests/lesson-nine-audit.spec.ts'
      - '.github/workflows/lesson9-audit.yml'

permissions:
  contents: read

jobs:
  lesson-nine:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Run lesson 9 audit
        run: npx playwright test tests/lesson-nine-audit.spec.ts --config=playwright.desktop.config.ts --workers=1
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lesson9-audit-${{ github.sha }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
