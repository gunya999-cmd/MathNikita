name: Lesson 123 certification

on:
  workflow_dispatch:
  push:
    branches: [lesson-123-build]

permissions:
  contents: read

concurrency:
  group: lesson-123-certification-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  chromium-123:
    name: Chromium · source, flow and Sulafat lesson 123
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Source, player and course-boundary contract
        run: npx playwright test tests/lesson-one-hundred-twenty-three-data.spec.ts tests/lesson-one-hundred-twenty-three-player.spec.ts tests/course-plan.spec.ts --config=playwright.desktop.config.ts --workers=1
      - name: Opening, navigation and exact §33 practice flow
        run: npx playwright test tests/lesson-one-hundred-twenty-three-flow.spec.ts --config=playwright.desktop.config.ts --workers=1
      - name: Sulafat narration payload audit
        run: npx playwright test tests/lesson-one-hundred-twenty-three-voice.spec.ts --config=playwright.desktop.config.ts --workers=1

  webkit-123:
    name: iPad WebKit · lesson 123
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - run: npx playwright install --with-deps webkit
      - name: iPad layout and first exact source task
        run: npx playwright test tests/lesson-one-hundred-twenty-three-ipad.spec.ts --workers=1

  certified:
    name: LESSON 123 CERTIFIED
    if: always()
    needs: [chromium-123, webkit-123]
    runs-on: ubuntu-latest
    steps:
      - name: Require Chromium and iPad lanes
        env:
          CHROMIUM_123: ${{ needs.chromium-123.result }}
          WEBKIT_123: ${{ needs.webkit-123.result }}
        run: |
          test "$CHROMIUM_123" = success
          test "$WEBKIT_123" = success
          echo "Lesson 123 §33 synthesis, 20/50 practice, Sulafat and iPad checks are certified."
