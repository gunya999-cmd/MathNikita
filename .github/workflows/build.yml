name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: TypeScript, Vite and Worker build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Build application
        run: npm run build
      - name: Validate Cloudflare Worker and narration API
        run: npx -y wrangler@4.114.0 deploy --dry-run --outdir .wrangler-dry-run
      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit
      - name: Certify lesson 125 regression
        run: npx playwright test tests/lesson-one-hundred-twenty-five-data.spec.ts tests/lesson-one-hundred-twenty-five-player.spec.ts tests/lesson-one-hundred-twenty-five-flow.spec.ts --config=playwright.desktop.config.ts --workers=1
      - name: Certify lessons 126-138 source, catalog and browser flow
        run: npx playwright test tests/lesson-one-hundred-twenty-six.spec.ts tests/lesson-one-hundred-twenty-six-flow.spec.ts tests/lesson-one-hundred-twenty-seven.spec.ts tests/lesson-one-hundred-twenty-seven-flow.spec.ts tests/lesson-one-hundred-twenty-eight.spec.ts tests/lesson-one-hundred-twenty-eight-flow.spec.ts tests/lesson-one-hundred-twenty-nine.spec.ts tests/lesson-one-hundred-twenty-nine-flow.spec.ts tests/lesson-one-hundred-thirty.spec.ts tests/lesson-one-hundred-thirty-flow.spec.ts tests/lesson-one-hundred-thirty-one.spec.ts tests/lesson-one-hundred-thirty-one-homework.spec.ts tests/lesson-one-hundred-thirty-one-flow.spec.ts tests/lesson-one-hundred-thirty-two.spec.ts tests/lesson-one-hundred-thirty-two-flow.spec.ts tests/lesson-one-hundred-thirty-three.spec.ts tests/lesson-one-hundred-thirty-three-flow.spec.ts tests/lesson-one-hundred-thirty-four.spec.ts tests/lesson-one-hundred-thirty-four-flow.spec.ts tests/lesson-one-hundred-thirty-five.spec.ts tests/lesson-one-hundred-thirty-five-flow.spec.ts tests/lesson-one-hundred-thirty-six.spec.ts tests/lesson-one-hundred-thirty-six-flow.spec.ts tests/lesson-one-hundred-thirty-seven.spec.ts tests/lesson-one-hundred-thirty-seven-flow.spec.ts tests/lesson-one-hundred-thirty-eight.spec.ts tests/lesson-one-hundred-thirty-eight-flow.spec.ts tests/course-plan.spec.ts --config=playwright.desktop.config.ts --workers=1
      - name: Certify iPad/WebKit for lessons 125-138
        run: npx playwright test tests/lesson-one-hundred-twenty-five-ipad.spec.ts tests/lesson-one-hundred-twenty-six-ipad.spec.ts tests/lesson-one-hundred-twenty-seven-ipad.spec.ts tests/lesson-one-hundred-twenty-eight-ipad.spec.ts tests/lesson-one-hundred-twenty-nine-ipad.spec.ts tests/lesson-one-hundred-thirty-ipad.spec.ts tests/lesson-one-hundred-thirty-one-ipad.spec.ts tests/lesson-one-hundred-thirty-two-ipad.spec.ts tests/lesson-one-hundred-thirty-three-ipad.spec.ts tests/lesson-one-hundred-thirty-four-ipad.spec.ts tests/lesson-one-hundred-thirty-five-ipad.spec.ts tests/lesson-one-hundred-thirty-six-ipad.spec.ts tests/lesson-one-hundred-thirty-seven-ipad.spec.ts tests/lesson-one-hundred-thirty-eight-ipad.spec.ts --workers=1
      - name: Upload production bundle
        uses: actions/upload-artifact@v4
        with:
          name: mathnikita-dist-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7
