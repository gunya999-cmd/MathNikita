name: Lesson 108 data check

on:
  workflow_dispatch:
  push:
    branches: [lesson-108-build]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lesson-108-data:
    name: Lesson 108 · control work 6 source, player and 8/15 contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - run: npx playwright test tests/lesson-one-hundred-eight-data.spec.ts tests/lesson-one-hundred-eight-player.spec.ts --config=playwright.desktop.config.ts --workers=1
