name: Lesson 7 audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/SegmentLengthPracticePlayer.tsx'
      - 'src/segmentPractice.css'
      - 'src/data/lessonSevenMentorScripts.json'
      - 'src/LessonReflection.tsx'
      - 'src/ExtendedPracticeLab.tsx'
      - 'src/PracticePythagoras.tsx'
      - 'src/VoiceNarrator.tsx'
      - 'tests/lesson-seven-audit.spec.ts'
      - '.github/workflows/lesson7-audit.yml'
  push:
    branches: [main]
    paths:
      - 'src/SegmentLengthPracticePlayer.tsx'
      - 'src/segmentPractice.css'
      - 'src/data/lessonSevenMentorScripts.json'
      - 'src/LessonReflection.tsx'
      - 'tests/lesson-seven-audit.spec.ts'

permissions:
  contents: read

jobs:
  lesson-seven:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Run lesson 7 audit
        run: npx playwright test tests/lesson-seven-audit.spec.ts --config=playwright.desktop.config.ts --workers=1
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lesson7-audit-${{ github.sha }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
