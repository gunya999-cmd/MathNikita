name: Dashboard Stage 3 iPad

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: dashboard-stage3-ipad-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  dashboard-ipad:
    name: iPad WebKit · student and parent dashboard KPI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx playwright install --with-deps webkit
      - name: Verify KPI, week comparison, recovery journal and responsive dashboard
        run: npx playwright test tests/learner-dashboard.spec.ts --config=playwright.config.ts --workers=1
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-stage3-ipad-${{ github.sha }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
