name: Lesson 121 certification

on:
  workflow_dispatch:
  push:
    branches: [lesson-121-build]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: lesson-121-certification-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  chromium-121:
    name: Chromium · source, flow and Sulafat lesson 121
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Source, player and course-boundary contract
        run: npx playwright test tests/lesson-one-hundred-twenty-one-data.spec.ts tests/lesson-one-hundred-twenty-one-player.spec.ts tests/course-plan.spec.ts --config=playwright.desktop.config.ts --workers=1
      - name: Opening, navigation and exact §33 practice flow
        run: npx playwright test tests/lesson-one-hundred-twenty-one-flow.spec.ts --config=playwright.desktop.config.ts --workers=1
      - name: Sulafat narration payload audit
        run: npx playwright test tests/lesson-one-hundred-twenty-one-voice.spec.ts --config=playwright.desktop.config.ts --workers=1

  webkit-121:
    name: iPad WebKit · lesson 121
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - run: npx playwright install --with-deps webkit
      - name: iPad layout and first exact equation task
        run: npx playwright test tests/lesson-one-hundred-twenty-one-ipad.spec.ts --workers=1

  certified:
    name: LESSON 121 CERTIFIED
    if: always()
    needs: [chromium-121, webkit-121]
    runs-on: ubuntu-latest
    steps:
      - name: Require Chromium and iPad lanes
        env:
          CHROMIUM_121: ${{ needs.chromium-121.result }}
          WEBKIT_121: ${{ needs.webkit-121.result }}
        run: |
          test "$CHROMIUM_121" = success
          test "$WEBKIT_121" = success
          echo "Lesson 121 §33 source, equations, 20/50 practice, Sulafat and iPad checks are certified."
