name: Lesson 11 audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/PlaneLineRayPracticePlayer.tsx'
      - 'src/planeLineRay.css'
      - 'src/CatMentor.tsx'
      - 'src/MentorResponsiveBehavior.tsx'
      - 'src/data/lessonElevenMentorScripts.json'
      - 'src/data/extendedPracticeLesson11.ts'
      - 'src/data/lessonElevenMastery.ts'
      - 'src/data/extendedPracticeData.ts'
      - 'src/extendedPracticeEngine.ts'
      - 'src/lessonElevenRevisionMigration.ts'
      - 'src/ExtendedPracticeLab.tsx'
      - 'src/LessonReflection.tsx'
      - 'src/PracticePythagoras.tsx'
      - 'src/VoiceNarrator.tsx'
      - 'tests/lesson-eleven-audit.spec.ts'
      - '.github/workflows/lesson11-audit.yml'
  push:
    branches: [main]
    paths:
      - 'src/PlaneLineRayPracticePlayer.tsx'
      - 'src/planeLineRay.css'
      - 'src/CatMentor.tsx'
      - 'src/MentorResponsiveBehavior.tsx'
      - 'src/data/lessonElevenMentorScripts.json'
      - 'src/data/extendedPracticeLesson11.ts'
      - 'src/data/lessonElevenMastery.ts'
      - 'src/data/extendedPracticeData.ts'
      - 'src/extendedPracticeEngine.ts'
      - 'src/lessonElevenRevisionMigration.ts'
      - 'src/ExtendedPracticeLab.tsx'
      - 'src/LessonReflection.tsx'
      - 'src/PracticePythagoras.tsx'
      - 'src/VoiceNarrator.tsx'
      - 'tests/lesson-eleven-audit.spec.ts'
      - '.github/workflows/lesson11-audit.yml'

permissions:
  contents: read

jobs:
  lesson-eleven:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Run lesson 11 audit
        run: npx playwright test tests/lesson-eleven-audit.spec.ts --config=playwright.desktop.config.ts --workers=1
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lesson11-audit-${{ github.sha }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
