name: Lesson 34 integration patch

on:
  push:
    branches: [feat/lesson-34-equations]
    paths:
      - '.github/workflows/lesson-34-integrate.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/lesson-34-equations
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: node scripts/integrate-lesson34.mjs
      - run: npm install
      - run: npm run build
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/LessonCourseShell.tsx src/data/yearPlan.ts src/data/extendedPracticeData.ts src/CourseCatalog.tsx src/App.tsx tests/course-plan.spec.ts tests/pedagogical-practice-quality.spec.ts tests/extended-practice-count.spec.ts
          git commit -m "Integrate lesson 34 into course"
          git push origin HEAD:feat/lesson-34-equations
