name: Lesson 90 one-shot integration
on:
  push:
    branches: [agent/lesson-90-control-work-five]
    paths: [.github/workflows/lesson-90-integrate-once.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lesson-90-control-work-five
      - run: node scripts/lesson-90-integrate-once.mjs
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Integrate control work five into course shell" || exit 0
          git push origin HEAD:agent/lesson-90-control-work-five
