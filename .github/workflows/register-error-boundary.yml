name: Probe production registration error boundary

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/register-error-boundary.yml'

permissions:
  contents: read

jobs:
  probe:
    if: github.event_name == 'pull_request' && github.head_ref == 'qa/register-error-boundary'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      BASE_URL: https://mathnikita.gunya999.workers.dev
      QA_STUDENT_ID: qa-boundary-${{ github.run_id }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
    steps:
      - name: Probe register and record response shape
        run: |
          set +e
          HTTP_CODE=$(curl -sS -o /tmp/register-body.txt -w '%{http_code}' -X POST "$BASE_URL/api/cloud/register" -H 'content-type: application/json' --data "{\"studentId\":\"$QA_STUDENT_ID\",\"name\":\"QA Boundary\",\"pin\":\"2468\",\"entries\":{}}")
          echo "Registration HTTP status: $HTTP_CODE"
          echo -n 'Registration body: '
          cat /tmp/register-body.txt
          echo
          test "$HTTP_CODE" = "500"
      - name: Remove QA profile if any row was created
        if: always()
        run: |
          set -eu
          cat > /tmp/mathnikita-boundary-cleanup.sql <<SQL
          DELETE FROM progress_history WHERE student_id='${QA_STUDENT_ID}';
          DELETE FROM student_sessions WHERE student_id='${QA_STUDENT_ID}';
          DELETE FROM student_progress WHERE student_id='${QA_STUDENT_ID}';
          DELETE FROM students WHERE id='${QA_STUDENT_ID}';
          SQL
          npx -y wrangler@4.118.0 d1 execute mathnikita-db --remote --file=/tmp/mathnikita-boundary-cleanup.sql
