# Delta release gate for lesson 83. Earlier certification workflows continue to protect prior lessons.
name: Course 1-83 certification

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: course-1-83-certification-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-content:
    name: Build + content + pedagogy through 83
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: >-
          npx playwright test
          tests/course-plan.spec.ts
          tests/pedagogical-practice-quality.spec.ts
          tests/extended-practice-count.spec.ts
          tests/lesson-eighty-three-source.spec.ts
          tests/lesson-eighty-three-full-flow.spec.ts
          --config=playwright.desktop.config.ts --workers=1
      - name: Complete all 20 mandatory practice tasks / 50 responses for lesson 83
        run: npx playwright test tests/lesson-eighty-three-practice.spec.ts --config=playwright.desktop.config.ts --workers=1

  chromium-83:
    name: Chromium runtime 83
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/lesson-eighty-three-full-flow.spec.ts tests/lesson-eighty-three-ipad.spec.ts --config=playwright.desktop.config.ts --workers=1

  webkit-83:
    name: iPad WebKit runtime 83
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - run: npx playwright install --with-deps webkit
      - run: npx playwright test tests/lesson-eighty-three-full-flow.spec.ts tests/lesson-eighty-three-ipad.spec.ts --workers=1

  voice-83:
    name: Sulafat voice + interruption 83
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/lesson-eighty-three-voice.spec.ts --config=playwright.desktop.config.ts --workers=1

  certified:
    name: COURSE 1-83 DELTA CERTIFIED
    if: always()
    needs: [build-content, chromium-83, webkit-83, voice-83]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every lesson 83 release lane passed
        env:
          BUILD_CONTENT: ${{ needs.build-content.result }}
          CHROMIUM_83: ${{ needs.chromium-83.result }}
          WEBKIT_83: ${{ needs.webkit-83.result }}
          VOICE_83: ${{ needs.voice-83.result }}
        run: |
          test "$BUILD_CONTENT" = success
          test "$CHROMIUM_83" = success
          test "$WEBKIT_83" = success
          test "$VOICE_83" = success
          echo "Lesson 83 delta is certified."
