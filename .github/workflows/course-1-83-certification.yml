# Delta release gate for lesson 83. Keep PR checks focused on the changed lesson;
# cumulative course hard-certification is triggered once for the exact release SHA.
name: Course 1-83 certification

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: course-1-83-certification-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  chromium-83:
    name: Chromium · contract, practice, runtime and Sulafat 83
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Verify course boundary, pedagogy and lesson 83 source contract
        run: >-
          npx playwright test
          tests/course-plan.spec.ts
          tests/pedagogical-practice-quality.spec.ts
          tests/extended-practice-count.spec.ts
          tests/lesson-eighty-three-source.spec.ts
          --config=playwright.desktop.config.ts --workers=1
      - name: Complete lesson 83 Chromium runtime
        run: npx playwright test tests/lesson-eighty-three-full-flow.spec.ts tests/lesson-eighty-three-ipad.spec.ts --config=playwright.desktop.config.ts --workers=1
      - name: Complete all 20 mandatory practice tasks / 50 responses
        run: npx playwright test tests/lesson-eighty-three-practice.spec.ts --config=playwright.desktop.config.ts --workers=1
      - name: Verify Sulafat sequencing and interruption
        run: npx playwright test tests/lesson-eighty-three-voice.spec.ts --config=playwright.desktop.config.ts --workers=1

  webkit-83:
    name: iPad WebKit runtime 83
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - run: npx playwright install --with-deps webkit
      - run: npx playwright test tests/lesson-eighty-three-full-flow.spec.ts tests/lesson-eighty-three-ipad.spec.ts --workers=1

  certified:
    name: COURSE 1-83 DELTA CERTIFIED
    if: always()
    needs: [chromium-83, webkit-83]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless both focused lesson 83 lanes passed
        env:
          CHROMIUM_83: ${{ needs.chromium-83.result }}
          WEBKIT_83: ${{ needs.webkit-83.result }}
        run: |
          test "$CHROMIUM_83" = success
          test "$WEBKIT_83" = success
          echo "Lesson 83 delta is certified."
