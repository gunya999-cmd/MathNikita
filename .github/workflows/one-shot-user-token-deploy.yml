name: One-shot production deploy with user token

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-user-token-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-current-main:
    if: github.event_name == 'pull_request' && github.head_ref == 'ci/deploy-user-token-2f560dcd'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact current main base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Build exact main base
        env:
          WORKERS_CI_COMMIT_SHA: ${{ github.event.pull_request.base.sha }}
          WORKERS_CI_BRANCH: main
          WORKERS_CI_BUILD_UUID: user-token-${{ github.run_id }}
        run: npm run build
      - name: Confirm user API token authenticates
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
        run: npx -y wrangler@4.118.0 whoami
      - name: Resolve existing mathnikita-db and create production config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
        run: |
          set -eu
          npx -y wrangler@4.118.0 d1 list --json > .d1-list.json
          node <<'NODE'
          const fs=require('fs');
          const list=JSON.parse(fs.readFileSync('.d1-list.json','utf8'));
          const db=Array.isArray(list)?list.find(x=>x?.name==='mathnikita-db'):null;
          if(!db) throw new Error('Existing D1 database mathnikita-db was not found');
          const id=db.uuid||db.id;
          if(!id) throw new Error('mathnikita-db has no database id');
          const config=JSON.parse(fs.readFileSync('wrangler.jsonc','utf8'));
          config.d1_databases=[{binding:'DB',database_name:'mathnikita-db',database_id:id}];
          fs.writeFileSync('.wrangler.production.json',JSON.stringify(config,null,2));
          console.log('Resolved existing mathnikita-db and prepared DB binding.');
          NODE
      - name: Deploy exact main with existing D1 binding
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
        run: npx -y wrangler@4.118.0 deploy --config .wrangler.production.json --no-x-provision
      - name: Verify live production exact SHA
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.base.sha }}
          VERSION_URL: https://mathnikita.gunya999.workers.dev/api/version
        run: |
          set -eu
          for attempt in $(seq 1 18); do
            body="$(curl --silent --show-error --fail --max-time 15 "$VERSION_URL" 2>/dev/null || true)"
            actual="$(BODY="$body" node -e 'try{const b=JSON.parse(process.env.BODY||"{}");if(!b.workerVersion?.id||!b.workerVersion?.timestamp)process.exit(2);process.stdout.write(String(b.gitSha||""))}catch{process.exit(3)}' 2>/dev/null || true)"
            if [ "$actual" = "$EXPECTED_SHA" ]; then
              echo "Production is serving exact main SHA: $actual"
              BODY="$body" node -e 'const b=JSON.parse(process.env.BODY);console.log(`Worker version: ${b.workerVersion.id}`);console.log(`Worker timestamp: ${b.workerVersion.timestamp}`);console.log(`Build UUID: ${b.buildUuid}`)'
              exit 0
            fi
            echo "Attempt $attempt: production SHA ${actual:-unavailable}; expected $EXPECTED_SHA"
            sleep 10
          done
          exit 1
