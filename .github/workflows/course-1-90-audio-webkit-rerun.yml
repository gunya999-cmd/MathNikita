name: Course 1-90 WebKit audio audit rerun

on:
  push:
    branches:
      - audit/course-1-90-audio-webkit-fix
  workflow_dispatch:

permissions:
  contents: read

jobs:
  webkit-ipad-lifecycle:
    name: WebKit iPad · narration lifecycle · lessons 1-90
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx playwright install --with-deps webkit
      - name: iPad/WebKit · opening cut-off + stage switch + replay
        run: npx playwright test tests/course-1-90-webkit-audio-lifecycle.spec.ts --config=playwright.audio-webkit.config.ts
