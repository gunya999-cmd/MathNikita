name: Lesson 35 integration patch

on:
  push:
    branches: [feat/lesson-35-equations-practice]
    paths: ['.github/workflows/lesson-35-integrate.yml']

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/lesson-35-equations-practice
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Wire lesson 35 into course shell and contracts
        run: |
          node <<'NODE'
          const fs=require('fs');
          function edit(path,fn){const before=fs.readFileSync(path,'utf8');const after=fn(before);if(after===before)throw new Error(`No change produced for ${path}`);fs.writeFileSync(path,after)}
          function one(s,from,to,label){if(!s.includes(from))throw new Error(`Missing ${label}`);return s.replace(from,to)}

          edit('src/LessonCourseShell.tsx',s=>{
            s=one(s,"import { EquationLessonPlayer } from './EquationLessonPlayer';","import { EquationLessonPlayer } from './EquationLessonPlayer';import { EquationPracticePlayer } from './EquationPracticePlayer';",'lesson35 player import');
            s=one(s,"import { lessonThirtyThirtyFourOpening } from './LessonThirtyFourOpening';","import { lessonThirtyThirtyFourOpening } from './LessonThirtyFourOpening';import { lessonThirtyFiveOpening } from './LessonThirtyFiveOpening';",'placeholder');
            return s;
          });
          NODE
