name: Apply answer validator codemod

on:
  push:
    branches: [fix/coursewide-answer-normalization]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: answer-validator-codemod
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/coursewide-answer-normalization
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - name: Apply semantic answer comparator migration
        run: node scripts/migrate-answer-comparators.mjs
      - name: Commit migrated players
        run: |
          if git diff --quiet; then
            echo "No comparator migrations needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "Migrate local answer comparators to semantic validator"
          git push origin HEAD:fix/coursewide-answer-normalization
