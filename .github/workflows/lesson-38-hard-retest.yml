name: Lesson 38 hard retest

on:
  push:
    branches: [feat/lesson-38-angle-mastery]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lesson-38-hard-retest
  cancel-in-progress: true

env:
  PRACTICE_START: 38
  PRACTICE_END: 38

jobs:
  build:
    name: Build + pedagogical quality · lesson 38
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - run: npm run build
      - run: npx playwright test tests/pedagogical-practice-quality.spec.ts tests/extended-practice-count.spec.ts --config=playwright.desktop.config.ts --workers=1

  chromium:
    name: Chromium · lesson 38 full flow, voice and 20-task practice
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/lesson-thirty-eight-full-flow.spec.ts tests/lesson-thirty-eight-ipad.spec.ts tests/lesson-thirty-eight-voice.spec.ts tests/extended-practice-all-lessons.spec.ts tests/course-plan.spec.ts --config=playwright.desktop.config.ts --workers=1

  webkit:
    name: iPad WebKit · lesson 38 full flow, voice and 20-task practice
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - run: npx playwright install --with-deps webkit
      - run: npx playwright test tests/lesson-thirty-eight-full-flow.spec.ts tests/lesson-thirty-eight-ipad.spec.ts tests/lesson-thirty-eight-voice.spec.ts tests/extended-practice-all-lessons.spec.ts tests/course-plan.spec.ts --config=playwright.config.ts --workers=1
