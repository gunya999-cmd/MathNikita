name: Studio voice priority

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/studioVoice.ts'
      - 'src/CatMentor.tsx'
      - 'src/VoiceNarrator.tsx'
      - 'src/ExtendedPracticeLab.tsx'
      - 'src/PracticePythagoras.tsx'
      - 'tests/studio-voice-priority.spec.ts'
      - '.github/workflows/studio-voice-priority.yml'

permissions:
  contents: read

jobs:
  priority-hard-test:
    name: Chromium · foreground voice beats warmup
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx playwright install chromium
      - name: Verify foreground TTS priority and bounded mentor warmup
        run: npx playwright test tests/studio-voice-priority.spec.ts --config=playwright.desktop.config.ts --workers=1
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: studio-voice-priority-${{ github.sha }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
