name: Lesson 36 integration patch

on:
  push:
    branches: [agent/lesson-36-equation-mastery]
    paths: ['.github/workflows/lesson-36-integrate.yml']

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lesson-36-equation-mastery
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Wire lesson 36 into course and QA contracts
        run: |
          node <<'NODE'
          const fs=require('fs');
          function edit(path,fn){const before=fs.readFileSync(path,'utf8');const after=fn(before);if(after===before)throw new Error(`No change produced for ${path}`);fs.writeFileSync(path,after)}
          function one(s,from,to,label){if(!s.includes(from))throw new Error(`Missing ${label}`);return s.replace(from,to)}

          edit('src/LessonCourseShell.tsx',s=>{
            s=one(s,"import { EquationLessonPlayer } from './EquationLessonPlayer';import { EquationPracticePlayer } from './EquationPracticePlayer';","import { EquationLessonPlayer } from './EquationLessonPlayer';import { EquationPracticePlayer } from './EquationPracticePlayer';import { EquationMasteryPlayer } from './EquationMasteryPlayer';",'lesson36 player import');
            s=one(s,"import { lessonThirtyFiveOpening } from './LessonThirtyFiveOpening';","import { lessonThirtyFiveOpening } from './LessonThirtyFiveOpening';import { lessonThirtySixOpening } from './LessonThirtySixOpening';",'lesson36 opening import');
            s=one(s,'const readyLessons=Array.from({length:35},(_,i)=>i+1);','const readyLessons=Array.from({length:36},(_,i)=>i+1);','ready lessons');
            s=one(s,'lessonThirtyThreeOpening,lessonThirtyFourOpening,lessonThirtyFiveOpening];','lessonThirtyThreeOpening,lessonThirtyFourOpening,lessonThirtyFiveOpening,lessonThirtySixOpening];','opening registry');
            s=one(s,'const runtime=selectedLesson===35?<EquationPracticePlayer key="lesson-35"/>:selectedLesson===34?<EquationLessonPlayer key="lesson-34"/>:','const runtime=selectedLesson===36?<EquationMasteryPlayer key="lesson-36"/>:selectedLesson===35?<EquationPracticePlayer key="lesson-35"/>:selectedLesson===34?<EquationLessonPlayer key="lesson-34"/>:','runtime registry');
            return s;
          });

          edit('src/data/extendedPracticeData.ts',s=>{
            s=one(s,"import { extendedPracticeLesson35 } from './extendedPracticeLesson35';","import { extendedPracticeLesson35 } from './extendedPracticeLesson35';\nimport { extendedPracticeLesson36 } from './extendedPracticeLesson36';",'practice36 import');
            s=one(s,'34:extendedPracticeLesson34,35:extendedPracticeLesson35};','34:extendedPracticeLesson34,35:extendedPracticeLesson35,36:extendedPracticeLesson36};','practice registry');
            s=one(s,'34:[],35:[]};','34:[],35:[],36:[]};','mastery registry');
            return s;
          });

          edit('src/data/yearPlan.ts',s=>one(s,'available:segment.from+offset<=35','available:segment.from+offset<=36','year plan availability'));

          edit('src/CourseCatalog.tsx',s=>{
            s=one(s,"35:'Закрепление § 10: уравнения с числовыми выражениями, план решения по шагам, текстовые задачи, поиск ошибок и проверка корня.'};","35:'Закрепление § 10: уравнения с числовыми выражениями, план решения по шагам, текстовые задачи, поиск ошибок и проверка корня.',36:'Итог § 10: смешанные уравнения, текстовые модели в обе стороны, диагностика ошибок, оценка корня, проверка подстановкой и нестандартные задачи.'};",'catalog lesson36 description');
            s=one(s,'Полностью готовы 35 интерактивных уроков.','Полностью готовы 36 интерактивных уроков.','catalog ready count');
            return s;
          });

          edit('src/App.tsx',s=>one(s,"i===1?'15 уроков готовы'","i===1?'16 уроков готовы'",'knowledge map ready count'));

          edit('tests/pedagogical-practice-quality.spec.ts',s=>one(s,'lessonNumber<=34','lessonNumber<=36','pedagogical range'));
          edit('tests/extended-practice-all-lessons.spec.ts',s=>one(s,'{18:24,20:11,34:28,35:28}','{18:24,20:11,34:28,35:28,36:30}','stage count registry'));

          edit('tests/course-plan.spec.ts',s=>{
            s=one(s,'through lesson 35','through lesson 36','course plan title');
            s=one(s,".toHaveCount(33);",".toHaveCount(34);",'interactive count');
            s=one(s,".toHaveCount(35);",".toHaveCount(36);",'enabled count');
            s=one(s,"  await expect(lessons.nth(35)).toContainText('Уравнение');\n  await expect(lessons.nth(35)).toBeDisabled();","  await expect(lessons.nth(35)).toContainText('Уравнение');\n  await expect(lessons.nth(35)).toBeEnabled();\n  await expect(lessons.nth(35)).toHaveClass(/is-interactive/);\n  await expect(lessons.nth(36)).toContainText('Угол. Обозначение углов');\n  await expect(lessons.nth(36)).toBeDisabled();",'lesson36/37 catalog assertions');
            s=one(s,'Полностью готовы 35 интерактивных уроков.','Полностью готовы 36 интерактивных уроков.','course plan ready text');
            return s;
          });
          NODE
      - name: Validate integration build
        run: |
          npm install
          npm run build
      - name: Commit integration
        run: |
          git config user.name "gunya999-cmd"
          git config user.email "gunya999@gmail.com"
          git add src/LessonCourseShell.tsx src/data/extendedPracticeData.ts src/data/yearPlan.ts src/CourseCatalog.tsx src/App.tsx tests/pedagogical-practice-quality.spec.ts tests/extended-practice-all-lessons.spec.ts tests/course-plan.spec.ts
          git commit -m "Wire lesson 36 into course"
          git push origin HEAD:agent/lesson-36-equation-mastery
