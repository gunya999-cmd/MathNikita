name: One-shot practice audit codemod

on:
  push:
    branches: [audit/extended-practice-and-version]
    paths:
      - 'scripts/update-practice-audits.mjs'
      - '.github/workflows/practice-audit-codemod.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  codemod:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/extended-practice-and-version
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/update-practice-audits.mjs
      - name: Commit updated audits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/lesson-nine-audit.spec.ts tests/lesson-ten-audit.spec.ts tests/lesson-eleven-audit.spec.ts tests/lesson-twelve-audit.spec.ts tests/lesson-thirteen-audit.spec.ts tests/lesson-fourteen-audit.spec.ts tests/lesson-fifteen-audit.spec.ts tests/lesson-sixteen-audit.spec.ts .github/workflows/practice-audit-codemod.yml scripts/update-practice-audits.mjs
          git commit -m "Update lesson audits for twenty-task practice"
          git push origin HEAD:audit/extended-practice-and-version
