name: Lesson 27 wiring

on:
  push:
    branches: [agent/lesson-27-subtraction-generalization]
    paths:
      - .github/workflows/lesson-27-wire.yml

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Wire lesson 27
        run: node scripts/wire-lesson27.mjs
      - name: Commit generated lesson
        run: |
          git config user.name "gunya999-cmd"
          git config user.email "gunya999@gmail.com"
          git add src tests .github/workflows/course-1-23-certification.yml
          git commit -m "Build lesson 27: subtraction generalization"
          git push
