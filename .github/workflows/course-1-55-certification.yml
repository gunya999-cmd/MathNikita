  certified:
    name: COURSE 1-55 CERTIFIED
    if: always()
    needs: [build-content, chromium-1-27, webkit-1-27, chromium-28-55, webkit-28-55, voice, accounts-cloud]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every release lane passed
        env:
          BUILD_CONTENT: ${{ needs.build-content.result }}
          CHROMIUM_1_27: ${{ needs.chromium-1-27.result }}
          WEBKIT_1_27: ${{ needs.webkit-1-27.result }}
          CHROMIUM_28_55: ${{ needs.chromium-28-55.result }}
          WEBKIT_28_55: ${{ needs.webkit-28-55.result }}
          VOICE: ${{ needs.voice.result }}
          ACCOUNTS: ${{ needs.accounts-cloud.result }}
        run: |
          printf '%s\n' \
            "build-content=$BUILD_CONTENT" \
            "chromium-1-27=$CHROMIUM_1_27" \
            "webkit-1-27=$WEBKIT_1_27" \
            "chromium-28-55=$CHROMIUM_28_55" \
            "webkit-28-55=$WEBKIT_28_55" \
            "voice=$VOICE" \
            "accounts-cloud=$ACCOUNTS"
          test "$BUILD_CONTENT" = success
          test "$CHROMIUM_1_27" = success
          test "$WEBKIT_1_27" = success
          test "$CHROMIUM_28_55" = success
          test "$WEBKIT_28_55" = success
          test "$VOICE" = success
          test "$ACCOUNTS" = success
