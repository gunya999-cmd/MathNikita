# Release gate for every ready lesson through the second §16 multiplication lesson.
name: Course 1-55 certification

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: course-1-55-certification-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-content:
    name: Build + content + pedagogy 1-55
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: >-
          npx playwright test
          tests/course-plan.spec.ts
          tests/pedagogical-practice-quality.spec.ts
          tests/lesson-analytics-engagement.spec.ts
          tests/extended-practice-all-lessons.spec.ts
          tests/extended-practice-count.spec.ts
          --config=playwright.desktop.config.ts --workers=1
      - name: Complete all practice tasks for lessons 52-55 with Sulafat and persistence
        env:
          PRACTICE_START: 52
          PRACTICE_END: 55
        run: npx playwright test tests/extended-practice-all-lessons.spec.ts --config=playwright.desktop.config.ts --workers=1

  chromium-1-27:
    name: Chromium runtime 1-27
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: >-
          npx playwright test
          tests/lessons-one-to-four-full-walkthrough.spec.ts
          tests/lesson-five-mastery.spec.ts
          tests/lesson-six-mastery.spec.ts
          tests/lessons-six-to-sixteen-runtime-and-pythagoras.spec.ts
          tests/lessons-seventeen-to-twenty-three-runtime-and-pythagoras.spec.ts
          tests/lesson-seventeen-ipad.spec.ts
          tests/lesson-eighteen-ipad.spec.ts
          tests/lesson-nineteen-ipad.spec.ts
          tests/lesson-twenty-ipad.spec.ts
          tests/lesson-twenty-correction.spec.ts
          tests/lesson-twenty-one-ipad.spec.ts
          tests/lesson-twenty-two-ipad.spec.ts
          tests/lesson-twenty-three-ipad.spec.ts
          tests/lesson-twenty-four-ipad.spec.ts
          tests/lesson-twenty-five-ipad.spec.ts
          tests/lesson-twenty-six-ipad.spec.ts
          tests/lesson-twenty-seven-ipad.spec.ts
          --config=playwright.desktop.config.ts --workers=1

