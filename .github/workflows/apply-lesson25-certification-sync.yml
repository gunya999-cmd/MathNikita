name: Apply lesson 25 certification sync

on:
  push:
    branches: [agent/lesson-25-subtraction]

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lesson-25-subtraction
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synchronize course QA through lesson 25
        run: |
          python - <<'PY'
          from pathlib import Path

          # Catalog counts in legacy browser specs. Only selector-scoped expectations are changed.
          for p in Path('tests').glob('*.ts'):
              text=p.read_text()
              updated=text.replace("page.locator('.course-lesson-grid > button.is-interactive')).toHaveCount(23)", "page.locator('.course-lesson-grid > button.is-interactive')).toHaveCount(24)")
              updated=updated.replace("page.locator('.course-lesson-grid > button:not([disabled])')).toHaveCount(24)", "page.locator('.course-lesson-grid > button:not([disabled])')).toHaveCount(25)")
              if updated!=text:
                  p.write_text(updated)

          # Official plan gate: 25 is ready, 26 is the first disabled lesson.
          p=Path('tests/course-plan.spec.ts')
          text=p.read_text()
          text=text.replace("await expect(lessons.nth(23)).toContainText('Сложение натуральных чисел. Свойства сложения');", "await expect(lessons.nth(23)).toContainText('Сложение натуральных чисел. Свойства сложения');\n  await expect(lessons.nth(24)).toContainText('Вычитание натуральных чисел');")
          text=text.replace("await expect(lessons.nth(23)).toBeEnabled();\n  await expect(lessons.nth(24)).toBeDisabled();", "await expect(lessons.nth(23)).toBeEnabled();\n  await expect(lessons.nth(24)).toBeEnabled();\n  await expect(lessons.nth(25)).toBeDisabled();")
          text=text.replace("Полностью готовы 24 интерактивных урока.", "Полностью готовы 25 интерактивных уроков.")
          p.write_text(text)

          # Pedagogical mandatory-practice gate includes lesson 25.
          p=Path('tests/pedagogical-practice-quality.spec.ts')
          text=p.read_text().replace('lessonNumber<=24','lessonNumber<=25')
          p.write_text(text)

          # Unified production certificate: 1-24 -> 1-25 and include dedicated lesson 25 specs.
          p=Path('.github/workflows/course-1-23-certification.yml')
          text=p.read_text()
          replacements={
            'Course 1-24 certification':'Course 1-25 certification',
            'course-1-24-certification-':'course-1-25-certification-',
            'course/practice integrity 1-24':'course/practice integrity 1-25',
            'desktop-runtime-1-24':'desktop-runtime-1-25',
            'Desktop Chromium · full runtime 1-24':'Desktop Chromium · full runtime 1-25',
            'voice-1-24':'voice-1-25',
            'Voice · every stage, sequencing and interruption 1-24':'Voice · every stage, sequencing and interruption 1-25',
            'ipad-17-24':'ipad-17-25',
            'iPad WebKit · lessons 17-24':'iPad WebKit · lessons 17-25',
            'Full iPad regression 17-24 and targeted control correction':'Full iPad regression 17-25 and targeted control correction',
            'certification-ipad-17-24-':'certification-ipad-17-25-',
            'COURSE 1-24 CERTIFIED':'COURSE 1-25 CERTIFIED',
            'IPAD_17_24':'IPAD_17_25',
            'ipad-17-24=':'ipad-17-25=',
          }
          for old,new in replacements.items():
              text=text.replace(old,new)
          text=text.replace('          tests/lesson-twenty-four-ipad.spec.ts\n          --config=playwright.desktop.config.ts', '          tests/lesson-twenty-four-ipad.spec.ts\n          tests/lesson-twenty-five-ipad.spec.ts\n          --config=playwright.desktop.config.ts')
          text=text.replace('          tests/lesson-twenty-four-voice.spec.ts\n          --config=playwright.desktop.config.ts', '          tests/lesson-twenty-four-voice.spec.ts\n          tests/lesson-twenty-five-voice.spec.ts\n          --config=playwright.desktop.config.ts')
          text=text.replace('          tests/lesson-twenty-four-ipad.spec.ts\n          --workers=1', '          tests/lesson-twenty-four-ipad.spec.ts\n          tests/lesson-twenty-five-ipad.spec.ts\n          --workers=1')
          p.write_text(text)

          # Guard against the exact stale catalog expectations that broke the previous expansion.
          stale=[]
          for p in Path('tests').glob('*.ts'):
              text=p.read_text()
              if "button.is-interactive')).toHaveCount(23)" in text or "button:not([disabled])')).toHaveCount(24)" in text:
                  stale.append(str(p))
          if stale:
              raise SystemExit('stale catalog counts remain: '+', '.join(stale))
          PY
      - name: Remove one-shot sync workflow
        run: git rm .github/workflows/apply-lesson25-certification-sync.yml
      - name: Commit synchronized QA
        run: |
          git config user.name "mathnikita-course-bot"
          git config user.email "actions@users.noreply.github.com"
          git add tests .github/workflows/course-1-23-certification.yml .github/workflows/apply-lesson25-certification-sync.yml
          git commit -m "Expand certification through lesson 25 [skip ci]"
          git push origin HEAD:agent/lesson-25-subtraction
