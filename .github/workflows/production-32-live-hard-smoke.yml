name: Production 33 live hard smoke

on:
  push:
    branches: [qa/production-32-hard-smoke]
    paths:
      - 'scripts/production-live-hard-smoke.mjs'
      - '.github/workflows/production-32-live-hard-smoke.yml'

permissions:
  contents: read

concurrency:
  group: production-33-live-hard-smoke
  cancel-in-progress: true

jobs:
  live-production:
    name: Live production · cloud + Chromium + iPad WebKit + lesson 33 control
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_SHA: a3b9aa4f05fce373b384848df09033b5d9d9520a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx playwright install --with-deps chromium webkit
      - name: Hard-test exact live production
        run: node scripts/production-live-hard-smoke.mjs
