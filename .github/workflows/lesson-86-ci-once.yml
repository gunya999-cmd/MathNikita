name: Lesson 86 one-shot CI migration
on:
  push:
    branches: [agent/lesson-86-combinatorics-reinforcement]
    paths: ['.github/workflows/lesson-86-ci-once.yml']
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lesson-86-combinatorics-reinforcement
      - run: node scripts/lesson-86-ci-once.mjs
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Migrate CI and project state through lesson 86"
          git push origin HEAD:agent/lesson-86-combinatorics-reinforcement
