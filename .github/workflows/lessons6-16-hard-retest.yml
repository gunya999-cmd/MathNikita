name: Lessons 6-16 hard retest

on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/lessons-six-to-sixteen-runtime-and-pythagoras.spec.ts'
      - '.github/workflows/lessons6-16-hard-retest.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-6-11:
    name: Chromium · strict content/state 6-11
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Strict audits lessons 6-11
        run: >-
          npx playwright test
          tests/lesson-six-task-five-audit.spec.ts
          tests/lesson-six-mastery.spec.ts
          tests/lesson-seven-audit.spec.ts
          tests/lesson-eight-audit.spec.ts
          tests/lesson-nine-audit.spec.ts
          tests/lesson-ten-audit.spec.ts
          tests/lesson-eleven-audit.spec.ts
          --config=playwright.desktop.config.ts --workers=1
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hard-retest-chromium-6-11-${{ github.sha }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  chromium-12-16:
    name: Chromium · strict content/state 12-16
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Strict audits lessons 12-16
        run: >-
          npx playwright test
          tests/lesson-twelve-audit.spec.ts
          tests/lesson-thirteen-audit.spec.ts
          tests/lesson-fourteen-audit.spec.ts
          tests/lesson-fifteen-audit.spec.ts
          tests/lesson-sixteen-audit.spec.ts
          tests/lesson-sixteen-feedback-audit.spec.ts
          --config=playwright.desktop.config.ts --workers=1
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hard-retest-chromium-12-16-${{ github.sha }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  webkit-6-11:
    name: iPad WebKit · strict content/state 6-11
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx playwright install --with-deps webkit
      - name: Repeat strict audits on iPad WebKit
        run: >-
          npx playwright test
          tests/lesson-six-ipad.spec.ts
          tests/lesson-six-mastery.spec.ts
          tests/lesson-six-marin-smoke.spec.ts
          tests/lesson-seven-audit.spec.ts
          tests/lesson-eight-audit.spec.ts
          tests/lesson-nine-audit.spec.ts
          tests/lesson-ten-audit.spec.ts
          tests/lesson-eleven-audit.spec.ts
          --workers=1
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hard-retest-webkit-6-11-${{ github.sha }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  webkit-12-16:
    name: iPad WebKit · strict content/state 12-16
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx playwright install --with-deps webkit
      - name: Repeat strict audits on iPad WebKit
        run: >-
          npx playwright test
          tests/lesson-twelve-audit.spec.ts
          tests/lesson-thirteen-audit.spec.ts
          tests/lesson-fourteen-audit.spec.ts
          tests/lesson-fifteen-audit.spec.ts
          tests/lesson-sixteen-audit.spec.ts
          tests/lesson-sixteen-feedback-audit.spec.ts
          --workers=1
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hard-retest-webkit-12-16-${{ github.sha }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  chromium-voice-runtime:
    name: Chromium · every stage + sequencing + Pythagoras 6-16
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Verify actual playback, sequencing, runtime and all Pythagoras actions
        run: >-
          npx playwright test
          tests/lessons-six-to-sixteen-every-stage-voice.spec.ts
          tests/lessons-six-to-sixteen-voice-sequencing.spec.ts
          tests/lessons-six-to-sixteen-runtime-and-pythagoras.spec.ts
          --config=playwright.desktop.config.ts --workers=1
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hard-retest-chromium-voice-${{ github.sha }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  webkit-voice-runtime:
    name: iPad WebKit · every stage + sequencing + Pythagoras 6-16
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx playwright install --with-deps webkit
      - name: Verify actual playback, sequencing, runtime and all Pythagoras actions
        run: >-
          npx playwright test
          tests/lessons-six-to-sixteen-every-stage-voice.spec.ts
          tests/lessons-six-to-sixteen-voice-sequencing.spec.ts
          tests/lessons-six-to-sixteen-runtime-and-pythagoras.spec.ts
          --workers=1
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hard-retest-webkit-voice-${{ github.sha }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
