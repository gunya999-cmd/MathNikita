name: Lesson 8 audit

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/PolylineLessonPlayer.tsx'
      - 'src/polyline.css'
      - 'src/data/lessonEightMentorScripts.json'
      - 'src/data/extendedPracticeLesson8.ts'
      - 'src/ExtendedPracticeLab.tsx'
      - 'src/LessonReflection.tsx'
      - 'src/PracticePythagoras.tsx'
      - 'src/VoiceNarrator.tsx'
      - 'tests/lesson-eight-audit.spec.ts'
      - '.github/workflows/lesson8-audit.yml'
  push:
    branches: [main]
    paths:
      - 'src/PolylineLessonPlayer.tsx'
      - 'src/data/lessonEightMentorScripts.json'
      - 'src/data/extendedPracticeLesson8.ts'
      - 'src/ExtendedPracticeLab.tsx'
      - 'tests/lesson-eight-audit.spec.ts'
      - '.github/workflows/lesson8-audit.yml'

permissions:
  contents: read

jobs:
  lesson-eight:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Run lesson 8 audit
        run: npx playwright test tests/lesson-eight-audit.spec.ts --config=playwright.desktop.config.ts --workers=1
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lesson8-audit-${{ github.sha }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
