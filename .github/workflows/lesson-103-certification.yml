name: Lesson 103 certification

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: lesson-103-certification-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  chromium-103:
    name: Chromium · source, flow and Sulafat lesson 103
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Source, player and course-boundary contract
        run: npx playwright test tests/lesson-one-hundred-three-data.spec.ts tests/lesson-one-hundred-three-player.spec.ts tests/course-plan.spec.ts --config=playwright.desktop.config.ts --workers=1
      - name: Opening, navigation and mandatory practice flow
        run: npx playwright test tests/lesson-one-hundred-three-flow.spec.ts --config=playwright.desktop.config.ts --workers=1
      - name: Sulafat narration payload audit
        run: npx playwright test tests/lesson-one-hundred-three-voice.spec.ts --config=playwright.desktop.config.ts --workers=1

  webkit-103:
    name: iPad WebKit · lesson 103
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - run: npx playwright install --with-deps webkit
      - name: iPad layout and exact source task
        run: npx playwright test tests/lesson-one-hundred-three-ipad.spec.ts --workers=1

  certified:
    name: LESSON 103 CERTIFIED
    if: always()
    needs: [chromium-103, webkit-103]
    runs-on: ubuntu-latest
    steps:
      - name: Require Chromium and iPad lanes
        env:
          CHROMIUM_103: ${{ needs.chromium-103.result }}
          WEBKIT_103: ${{ needs.webkit-103.result }}
        run: |
          test "$CHROMIUM_103" = success
          test "$WEBKIT_103" = success
          echo "Lesson 103 source, flow, boundary, mandatory practice, Sulafat and iPad checks are certified."
