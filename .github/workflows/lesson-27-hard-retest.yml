name: Lesson 27 hard retest

on:
  workflow_dispatch:
  push:
    branches: [agent/lesson-27-subtraction-generalization]

permissions:
  contents: read

concurrency:
  group: lesson-27-hard-retest-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build · lesson 27
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run build

  chromium:
    name: Chromium · lesson 27 full flow, voice and 20-task practice
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Full main lesson and response persistence
        run: npx playwright test tests/lesson-twenty-seven-ipad.spec.ts --config=playwright.desktop.config.ts --workers=1
      - name: Every-stage Sulafat, Pythagoras and narration interruption
        run: npx playwright test tests/lesson-twenty-seven-voice.spec.ts --config=playwright.desktop.config.ts --workers=1
      - name: Complete all 20 mandatory-practice tasks
        env:
          PRACTICE_START: 27
          PRACTICE_END: 27
        run: npx playwright test tests/extended-practice-all-lessons.spec.ts --config=playwright.desktop.config.ts --workers=1
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lesson-27-chromium-${{ github.sha }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  ipad:
    name: iPad WebKit · lesson 27 full flow, voice and 20-task practice
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx playwright install --with-deps webkit
      - name: Full main lesson and responsive layout
        run: npx playwright test tests/lesson-twenty-seven-ipad.spec.ts --config=playwright.config.ts --workers=1
      - name: Every-stage Sulafat, Pythagoras and narration interruption
        run: npx playwright test tests/lesson-twenty-seven-voice.spec.ts --config=playwright.config.ts --workers=1
      - name: Complete all 20 mandatory-practice tasks
        env:
          PRACTICE_START: 27
          PRACTICE_END: 27
        run: npx playwright test tests/extended-practice-all-lessons.spec.ts --config=playwright.config.ts --workers=1
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lesson-27-ipad-${{ github.sha }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
