name: Lesson 102 certification

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: lesson-102-certification-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  chromium-102:
    name: Chromium · source, flow and Sulafat lesson 102
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Source, player and course-boundary contract
        run: npx playwright test tests/lesson-one-hundred-two-data.spec.ts tests/lesson-one-hundred-two-player.spec.ts tests/course-plan.spec.ts --config=playwright.desktop.config.ts --workers=1
      - name: Opening, navigation and mandatory practice flow
        run: npx playwright test tests/lesson-one-hundred-two-flow.spec.ts --config=playwright.desktop.config.ts --workers=1
      - name: Sulafat narration payload audit
        run: npx playwright test tests/lesson-one-hundred-two-voice.spec.ts --config=playwright.desktop.config.ts --workers=1

  webkit-102:
    name: iPad WebKit · lesson 102
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - run: npx playwright install --with-deps webkit
      - name: iPad layout and exact source task
        run: npx playwright test tests/lesson-one-hundred-two-ipad.spec.ts --workers=1

  certified:
    name: LESSON 102 CERTIFIED
    if: always()
    needs: [chromium-102, webkit-102]
    runs-on: ubuntu-latest
    steps:
      - name: Require Chromium and iPad lanes
        env:
          CHROMIUM_102: ${{ needs.chromium-102.result }}
          WEBKIT_102: ${{ needs.webkit-102.result }}
        run: |
          test "$CHROMIUM_102" = success
          test "$WEBKIT_102" = success
          echo "Lesson 102 source, flow, boundary, mandatory practice, Sulafat and iPad checks are certified."
