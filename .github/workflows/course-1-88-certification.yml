# Delta release gate for lesson 88. Keep PR checks focused on the changed lesson;
# cumulative course hard-certification is triggered once for the exact release SHA.
name: Course 1-88 certification

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: course-1-88-certification-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  chromium-88:
    name: Chromium · contract, practice, runtime and Sulafat 88
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Verify course boundary, pedagogy and lesson 88 source contract
        run: >-
          npx playwright test
          tests/course-plan.spec.ts
          tests/pedagogical-practice-quality.spec.ts
          tests/extended-practice-count.spec.ts
          tests/lesson-eighty-eight-source.spec.ts
          --config=playwright.desktop.config.ts --workers=1
      - name: Complete lesson 88 Chromium runtime
        run: npx playwright test tests/lesson-eighty-eight-full-flow.spec.ts tests/lesson-eighty-eight-ipad.spec.ts --config=playwright.desktop.config.ts --workers=1
      - name: Complete all 20 mandatory practice tasks / 50 responses
        run: npx playwright test tests/lesson-eighty-eight-practice.spec.ts --config=playwright.desktop.config.ts --workers=1
      - name: Verify Sulafat sequencing and interruption
        run: npx playwright test tests/lesson-eighty-eight-voice.spec.ts --config=playwright.desktop.config.ts --workers=1

  webkit-88:
    name: iPad WebKit runtime 88
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - run: npx playwright install --with-deps webkit
      - run: npx playwright test tests/lesson-eighty-eight-full-flow.spec.ts tests/lesson-eighty-eight-ipad.spec.ts --workers=1

  certified:
    name: COURSE 1-88 DELTA CERTIFIED
    if: always()
    needs: [chromium-88, webkit-88]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless both focused lesson 88 lanes passed
        env:
          CHROMIUM_88: ${{ needs.chromium-88.result }}
          WEBKIT_88: ${{ needs.webkit-88.result }}
        run: |
          test "$CHROMIUM_88" = success
          test "$WEBKIT_88" = success
          echo "Lesson 88 delta is certified."
