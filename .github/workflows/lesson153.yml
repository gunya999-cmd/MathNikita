name: Lesson 153 certification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lesson153:
    name: Chromium + iPad · lesson 153 finale
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - name: Certify lesson 153 source, player, catalog and Chromium flow
        run: npx playwright test tests/lesson-one-hundred-fifty-three.spec.ts tests/lesson-one-hundred-fifty-three-player.spec.ts tests/lesson-one-hundred-fifty-three-flow.spec.ts tests/course-plan.spec.ts --config=playwright.desktop.config.ts --workers=1
      - name: Certify lesson 153 iPad/WebKit
        run: npx playwright test tests/lesson-one-hundred-fifty-three-ipad.spec.ts --workers=1
