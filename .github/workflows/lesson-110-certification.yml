name: Lesson 110 certification

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: lesson-110-certification-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  chromium-110:
    name: Chromium · source, flow and Sulafat lesson 110
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Source, player and course-boundary contract
        run: npx playwright test tests/lesson-one-hundred-ten-data.spec.ts tests/lesson-one-hundred-ten-player.spec.ts tests/course-plan.spec.ts --config=playwright.desktop.config.ts --workers=1
      - name: Opening, navigation and exact §30 practice flow
        run: npx playwright test tests/lesson-one-hundred-ten-flow.spec.ts --config=playwright.desktop.config.ts --workers=1
      - name: Sulafat narration payload audit
        run: npx playwright test tests/lesson-one-hundred-ten-voice.spec.ts --config=playwright.desktop.config.ts --workers=1

  webkit-110:
    name: iPad WebKit · lesson 110
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - run: npx playwright install --with-deps webkit
      - name: iPad layout and exact source task
        run: npx playwright test tests/lesson-one-hundred-ten-ipad.spec.ts --workers=1

  certified:
    name: LESSON 110 CERTIFIED
    if: always()
    needs: [chromium-110, webkit-110]
    runs-on: ubuntu-latest
    steps:
      - name: Require Chromium and iPad lanes
        env:
          CHROMIUM_110: ${{ needs.chromium-110.result }}
          WEBKIT_110: ${{ needs.webkit-110.result }}
        run: |
          test "$CHROMIUM_110" = success
          test "$WEBKIT_110" = success
          echo "Lesson 110 §30 source, flow, boundary, 20/50 practice, Sulafat and iPad checks are certified."
