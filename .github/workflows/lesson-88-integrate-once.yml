name: Lesson 88 one-shot integration
on:
  push:
    branches: [agent/lesson-88-chapter-three-review]
    paths: ['.github/workflows/lesson-88-integrate-once.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lesson-88-chapter-three-review
      - run: node scripts/lesson-88-integrate-once.mjs
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Integrate lesson 88 into course shell"
          git push origin HEAD:agent/lesson-88-chapter-three-review
