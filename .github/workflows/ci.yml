name: CI

on:
  workflow_dispatch:
  schedule:
    - cron: '23 2 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-direct-v4-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: TypeScript, Vite and Worker build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Build application
        run: npm run build
      - name: Validate Cloudflare Worker and narration API
        run: npx -y wrangler@4.114.0 deploy --dry-run --outdir .wrangler-dry-run
      - name: Upload production bundle
        uses: actions/upload-artifact@v4
        with:
          name: mathnikita-dist-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7

  cloud-student-sync:
    name: Cloudflare D1 · student auth and sync
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Build application
        run: npm run build
      - name: Verify real local D1 API
        run: node scripts/cloud-api-smoke.mjs
      - name: Install Chromium browser
        run: npx playwright install --with-deps chromium
      - name: Verify cloud UI, recovery and in-flight synchronization
        run: npx playwright test tests/cloud-student-ui.spec.ts tests/cloud-sync-races.spec.ts --config=playwright.profile.config.ts --workers=1
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-student-sync-traces-${{ github.sha }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  desktop-chromium-lesson6-voice:
    name: Desktop Chromium · lesson 6, analytics and dashboards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Install Chromium browser
        run: npx playwright install --with-deps chromium
      - name: Verify lesson 6 desktop voice parity
        run: npx playwright test tests/lesson-six-desktop-voice.spec.ts --config=playwright.desktop.config.ts --workers=1
      - name: Verify lesson 6 task 5 feedback and TTS load
        run: npx playwright test tests/lesson-six-task-five-audit.spec.ts --config=playwright.desktop.config.ts --workers=1
      - name: Verify learner and parent dashboards
        run: npx playwright test tests/learner-dashboard.spec.ts --config=playwright.desktop.config.ts --workers=1
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-chromium-traces-${{ github.sha }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  desktop-chromium-student-profiles:
    name: Desktop Chromium · student profiles and isolation
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Install Chromium browser
        run: npx playwright install --with-deps chromium
      - name: Verify registration, PIN and per-student storage isolation
        run: npx playwright test tests/student-profiles.spec.ts --config=playwright.profile.config.ts --workers=1
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: student-profile-traces-${{ github.sha }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  ipad-webkit-lesson5-regression:
    name: iPad WebKit regression · lesson 5 Sulafat
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Install WebKit browser
        run: npx playwright install --with-deps webkit
      - name: Verify Sulafat Worker failover
        run: npx playwright test tests/worker-narration-failover.spec.ts --workers=1
      - name: Verify lesson 5 Sulafat smoke
        run: npx playwright test tests/lesson-five-marin-smoke.spec.ts --workers=1
      - name: Verify lesson 5 practice voice and Pythagoras
        run: npx playwright test tests/lesson-five-practice-voice.spec.ts --workers=1
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lesson5-webkit-traces-${{ github.sha }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  ipad-webkit-lesson6-main:
    name: iPad WebKit · lesson 6 full main walkthrough
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Install WebKit browser
        run: npx playwright install --with-deps webkit
      - name: Complete all lesson 6 main stages
        run: npx playwright test tests/lesson-six-ipad.spec.ts -g "completes every main stage" --workers=1
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lesson6-main-webkit-traces-${{ github.sha }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  ipad-webkit-lesson6-readiness:
    name: iPad WebKit · lesson 6 mastery, state and Sulafat
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Install WebKit browser
        run: npx playwright install --with-deps webkit
      - name: Verify lesson 6 state migration
        run: npx playwright test tests/lesson-six-ipad.spec.ts -g "keeps an answer|v2 ignores" --workers=1
      - name: Verify lesson 6 workload and completion gate
        run: npx playwright test tests/lesson-six-mastery.spec.ts --workers=1
      - name: Verify lesson 6 Sulafat smoke
        run: npx playwright test tests/lesson-six-marin-smoke.spec.ts --workers=1
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lesson6-readiness-webkit-traces-${{ github.sha }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
