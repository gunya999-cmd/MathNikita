name: Live cloud profile smoke on node crypto PBKDF2 build

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cloud-smoke-26ab8bb.yml'

permissions:
  contents: read

jobs:
  smoke:
    if: github.event_name == 'pull_request' && github.head_ref == 'qa/cloud-smoke-26ab8bb'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: https://mathnikita.gunya999.workers.dev
      QA_STUDENT_ID: qa-cloud-${{ github.run_id }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify exact SHA, register, snapshot, sync and fresh login
        run: |
          node <<'NODE'
          const base=process.env.BASE_URL;
          const studentId=process.env.QA_STUDENT_ID;
          const pin='2468';
          async function json(path,options={}){
            const response=await fetch(base+path,{...options,headers:{'content-type':'application/json',...(options.headers||{})}});
            const text=await response.text();
            let body={};try{body=text?JSON.parse(text):{}}catch{body={raw:text}}
            if(!response.ok)throw new Error(`${path} ${response.status}: ${JSON.stringify(body)}`);
            return body;
          }
          const version=await json('/api/version');
          if(version.gitSha!=='26ab8bbd3ac651770b69e6ddd9ab87825cc3c1fe')throw new Error(`Unexpected production SHA: ${version.gitSha}`);
          const status=await json('/api/cloud/status');
          if(status.configured!==true)throw new Error('Cloud profiles are not configured');
          const registered=await json('/api/cloud/register',{method:'POST',body:JSON.stringify({studentId,name:'QA Cloud',pin,entries:{'mathnikita:qa':'before'}})});
          if(!registered.ok||!registered.token||!registered.student?.code||!registered.recoveryCode)throw new Error('Incomplete registration response');
          if(registered.entries?.['mathnikita:qa']!=='before')throw new Error('Initial cloud entry was not persisted');
          const auth={authorization:`Bearer ${registered.token}`};
          const first=await json('/api/cloud/snapshot',{headers:auth});
          if(first.student?.id!==studentId||first.entries?.['mathnikita:qa']!=='before')throw new Error('Initial snapshot mismatch');
          const synced=await json('/api/cloud/sync',{method:'POST',headers:auth,body:JSON.stringify({baseRevision:first.revision,changes:{'mathnikita:qa':'after','mathnikita:qa2':'ok'}})});
          if(synced.revision!==first.revision+1)throw new Error('Sync revision did not advance');
          const second=await json('/api/cloud/snapshot',{headers:auth});
          if(second.entries?.['mathnikita:qa']!=='after'||second.entries?.['mathnikita:qa2']!=='ok')throw new Error('Synced values missing');
          const login=await json('/api/cloud/login',{method:'POST',body:JSON.stringify({code:registered.student.code,pin})});
          if(!login.ok||login.student?.id!==studentId||login.entries?.['mathnikita:qa']!=='after'||login.entries?.['mathnikita:qa2']!=='ok')throw new Error('Fresh login did not restore cloud progress');
          console.log('LIVE CLOUD PASS: register -> snapshot -> sync -> snapshot -> fresh login');
          NODE
      - name: Remove temporary QA rows
        if: always()
        run: |
          set -eu
          cat > /tmp/qa-cloud-cleanup.sql <<SQL
          DELETE FROM progress_history WHERE student_id='${QA_STUDENT_ID}';
          DELETE FROM student_sessions WHERE student_id='${QA_STUDENT_ID}';
          DELETE FROM student_progress WHERE student_id='${QA_STUDENT_ID}';
          DELETE FROM students WHERE id='${QA_STUDENT_ID}';
          SQL
          npx -y wrangler@4.118.0 d1 execute mathnikita-db --remote --file=/tmp/qa-cloud-cleanup.sql
          echo 'QA production profile removed.'
