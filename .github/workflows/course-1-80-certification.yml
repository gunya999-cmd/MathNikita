# Delta release gate for lesson 80. Earlier certification workflows continue to protect prior lessons.
name: Course 1-80 certification

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: course-1-80-certification-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-content:
    name: Build + content + pedagogy through 80
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: >-
          npx playwright test
          tests/course-plan.spec.ts
          tests/pedagogical-practice-quality.spec.ts
          tests/extended-practice-count.spec.ts
          tests/lesson-eighty-source.spec.ts
          tests/lesson-eighty-full-flow.spec.ts
          --config=playwright.desktop.config.ts --workers=1
      - name: Complete all 20 mandatory practice tasks / 50 responses for lesson 80
        run: npx playwright test tests/lesson-eighty-practice.spec.ts --config=playwright.desktop.config.ts --workers=1

  chromium-80:
    name: Chromium runtime 80
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/lesson-eighty-full-flow.spec.ts tests/lesson-eighty-ipad.spec.ts --config=playwright.desktop.config.ts --workers=1

  webkit-80:
    name: iPad WebKit runtime 80
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx playwright install --with-deps webkit
      - run: npx playwright test tests/lesson-eighty-full-flow.spec.ts tests/lesson-eighty-ipad.spec.ts --workers=1

  voice-80:
    name: Sulafat voice + interruption 80
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/lesson-eighty-voice.spec.ts --config=playwright.desktop.config.ts --workers=1

  certified:
    name: COURSE 1-80 DELTA CERTIFIED
    if: always()
    needs: [build-content, chromium-80, webkit-80, voice-80]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every lesson 80 release lane passed
        env:
          BUILD_CONTENT: ${{ needs.build-content.result }}
          CHROMIUM_80: ${{ needs.chromium-80.result }}
          WEBKIT_80: ${{ needs.webkit-80.result }}
          VOICE_80: ${{ needs.voice-80.result }}
        run: |
          test "$BUILD_CONTENT" = success
          test "$CHROMIUM_80" = success
          test "$WEBKIT_80" = success
          test "$VOICE_80" = success
          echo "Lesson 80 delta is certified."
