name: Lesson 116 certification

on:
  workflow_dispatch:
  push:
    branches: [lesson-116-build]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: lesson-116-certification-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  chromium-116:
    name: Chromium · source, flow and Sulafat lesson 116
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Source, player and course-boundary contract
        run: npx playwright test tests/lesson-one-hundred-sixteen-data.spec.ts tests/lesson-one-hundred-sixteen-player.spec.ts tests/course-plan.spec.ts --config=playwright.desktop.config.ts --workers=1
      - name: Opening, navigation and exact §32 practice flow
        run: npx playwright test tests/lesson-one-hundred-sixteen-flow.spec.ts --config=playwright.desktop.config.ts --workers=1
      - name: Sulafat narration payload audit
        run: npx playwright test tests/lesson-one-hundred-sixteen-voice.spec.ts --config=playwright.desktop.config.ts --workers=1

  webkit-116:
    name: iPad WebKit · lesson 116
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - run: npx playwright install --with-deps webkit
      - name: iPad layout and decimal-rounding source task
        run: npx playwright test tests/lesson-one-hundred-sixteen-ipad.spec.ts --workers=1

  certified:
    name: LESSON 116 CERTIFIED
    if: always()
    needs: [chromium-116, webkit-116]
    runs-on: ubuntu-latest
    steps:
      - name: Require Chromium and iPad lanes
        env:
          CHROMIUM_116: ${{ needs.chromium-116.result }}
          WEBKIT_116: ${{ needs.webkit-116.result }}
        run: |
          test "$CHROMIUM_116" = success
          test "$WEBKIT_116" = success
          echo "Lesson 116 §32 source, flow, rounding rules, 20/50 practice, Sulafat and iPad checks are certified."
