name: Lesson 97 certification

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: lesson-97-certification-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  chromium-97:
    name: Chromium · source, flow and Sulafat lesson 97
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Source and player contract
        run: npx playwright test tests/lesson-ninety-seven-data.spec.ts tests/lesson-ninety-seven-player.spec.ts --config=playwright.desktop.config.ts --workers=1
      - name: Opening, navigation and mandatory practice flow
        run: npx playwright test tests/lesson-ninety-seven-flow.spec.ts --config=playwright.desktop.config.ts --workers=1
      - name: Sulafat narration payload audit
        run: npx playwright test tests/lesson-ninety-seven-voice.spec.ts --config=playwright.desktop.config.ts --workers=1

  webkit-97:
    name: iPad WebKit · lesson 97
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - run: npx playwright install --with-deps webkit
      - name: iPad layout and source task
        run: npx playwright test tests/lesson-ninety-seven-ipad.spec.ts --workers=1

  certified:
    name: LESSON 97 CERTIFIED
    if: always()
    needs: [chromium-97, webkit-97]
    runs-on: ubuntu-latest
    steps:
      - name: Require Chromium and iPad lanes
        env:
          CHROMIUM_97: ${{ needs.chromium-97.result }}
          WEBKIT_97: ${{ needs.webkit-97.result }}
        run: |
          test "$CHROMIUM_97" = success
          test "$WEBKIT_97" = success
          echo "Lesson 97 source, flow, mandatory practice, Sulafat and iPad checks are certified."
