# Delta release gate for lesson 74. Earlier certification workflows continue to protect prior lessons.
name: Course 1-74 certification

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: course-1-74-certification-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-content:
    name: Build + content + pedagogy through 74
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: >-
          npx playwright test
          tests/course-plan.spec.ts
          tests/pedagogical-practice-quality.spec.ts
          tests/extended-practice-count.spec.ts
          tests/lesson-seventy-four-source.spec.ts
          tests/lesson-seventy-four-full-flow.spec.ts
          --config=playwright.desktop.config.ts --workers=1
      - name: Complete all 20 mandatory practice tasks / 50 responses for lesson 74
        run: npx playwright test tests/lesson-seventy-four-practice.spec.ts --config=playwright.desktop.config.ts --workers=1

  chromium-74:
    name: Chromium runtime 74
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/lesson-seventy-four-full-flow.spec.ts tests/lesson-seventy-four-ipad.spec.ts --config=playwright.desktop.config.ts --workers=1

  webkit-74:
    name: iPad WebKit runtime 74
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx playwright install --with-deps webkit
      - run: npx playwright test tests/lesson-seventy-four-full-flow.spec.ts tests/lesson-seventy-four-ipad.spec.ts --workers=1

  voice-74:
    name: Sulafat voice + interruption 74
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/lesson-seventy-four-voice.spec.ts --config=playwright.desktop.config.ts --workers=1

  certified:
    name: COURSE 1-74 DELTA CERTIFIED
    if: always()
    needs: [build-content, chromium-74, webkit-74, voice-74]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every lesson 74 release lane passed
        env:
          BUILD_CONTENT: ${{ needs.build-content.result }}
          CHROMIUM_74: ${{ needs.chromium-74.result }}
          WEBKIT_74: ${{ needs.webkit-74.result }}
          VOICE_74: ${{ needs.voice-74.result }}
        run: |
          test "$BUILD_CONTENT" = success
          test "$CHROMIUM_74" = success
          test "$WEBKIT_74" = success
          test "$VOICE_74" = success
          echo "Lesson 74 delta is certified."
