name: Lesson 107 certification

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: lesson-107-certification-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  chromium-107:
    name: Chromium · chapter review, flow and Sulafat lesson 107
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Review data, player and course-boundary contract
        run: npx playwright test tests/lesson-one-hundred-seven-data.spec.ts tests/lesson-one-hundred-seven-player.spec.ts tests/course-plan.spec.ts --config=playwright.desktop.config.ts --workers=1
      - name: Opening, navigation and chapter 4 diagnostic flow
        run: npx playwright test tests/lesson-one-hundred-seven-flow.spec.ts --config=playwright.desktop.config.ts --workers=1
      - name: Sulafat narration payload audit
        run: npx playwright test tests/lesson-one-hundred-seven-voice.spec.ts --config=playwright.desktop.config.ts --workers=1

  webkit-107:
    name: iPad WebKit · lesson 107
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - run: npx playwright install --with-deps webkit
      - name: iPad layout and diagnostic task
        run: npx playwright test tests/lesson-one-hundred-seven-ipad.spec.ts --workers=1

  certified:
    name: LESSON 107 CERTIFIED
    if: always()
    needs: [chromium-107, webkit-107]
    runs-on: ubuntu-latest
    steps:
      - name: Require Chromium and iPad lanes
        env:
          CHROMIUM_107: ${{ needs.chromium-107.result }}
          WEBKIT_107: ${{ needs.webkit-107.result }}
        run: |
          test "$CHROMIUM_107" = success
          test "$WEBKIT_107" = success
          echo "Lesson 107 chapter 4 review, flow, boundary, diagnostic practice, Sulafat and iPad checks are certified."
