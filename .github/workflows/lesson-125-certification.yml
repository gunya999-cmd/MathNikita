name: Lesson 125 certification

on:
  workflow_dispatch:
  push:
    branches: [lesson-125-build, main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: lesson-125-certification-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  chromium-125:
    name: Chromium · exact control 7 and frozen primary result
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Source, player and course-boundary contract
        run: npx playwright test tests/lesson-one-hundred-twenty-five-data.spec.ts tests/lesson-one-hundred-twenty-five-player.spec.ts tests/course-plan.spec.ts --config=playwright.desktop.config.ts --workers=1
      - name: Exact control flow, answer secrecy and correction isolation
        run: npx playwright test tests/lesson-one-hundred-twenty-five-flow.spec.ts --config=playwright.desktop.config.ts --workers=1

  webkit-125:
    name: iPad WebKit · control work 7
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - run: npx playwright install --with-deps webkit
      - name: iPad layout and answer secrecy
        run: npx playwright test tests/lesson-one-hundred-twenty-five-ipad.spec.ts --workers=1

  certified:
    name: LESSON 125 CERTIFIED
    if: always()
    needs: [chromium-125, webkit-125]
    runs-on: ubuntu-latest
    steps:
      - name: Require Chromium and iPad lanes
        env:
          CHROMIUM_125: ${{ needs.chromium-125.result }}
          WEBKIT_125: ${{ needs.webkit-125.result }}
        run: |
          test "$CHROMIUM_125" = success
          test "$WEBKIT_125" = success
          echo "Lesson 125 control work 7 is certified: source-exact workload, hidden answers before submission, frozen primary result, isolated correction and iPad coverage."