name: Lesson 46 integrate v2
on:
  push:
    branches: [agent/lesson-46-triangle-types]
permissions:
  contents: write
jobs:
  integrate:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lesson-46-triangle-types
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Patch lesson 46 integration points
        run: |
          python - <<'PY'
          from pathlib import Path
          def patch(path, old, new):
              p=Path(path); text=p.read_text()
              if new in text: return
              if old not in text: raise SystemExit(f'missing pattern in {path}: {old[:120]}')
              p.write_text(text.replace(old,new))
          patch('src/data/yearPlan.ts','available:segment.from+offset<=45','available:segment.from+offset<=46')
          patch('src/CourseCatalog.tsx',"45:'Закрепление § 13: построение многоугольников, стороны и диагонали, правила n − 3 и n(n − 3) : 2, периметр, равные фигуры и обратные задачи.'};", "45:'Закрепление § 13: построение многоугольников, стороны и диагонали, правила n − 3 и n(n − 3) : 2, периметр, равные фигуры и обратные задачи.',46:'Новая тема § 14: треугольник, классификация по углам и сторонам, два независимых вида, равнобедренный и равносторонний треугольники, периметр.'};")
          patch('src/CourseCatalog.tsx','Полностью готовы 45 уроков.','Полностью готовы 46 уроков.')
          shell='src/LessonCourseShell.tsx'
          patch(shell,"import { PolygonConstructionPlayer } from './PolygonConstructionPlayer';", "import { PolygonConstructionPlayer } from './PolygonConstructionPlayer';import { TriangleTypesPlayer } from './TriangleTypesPlayer';")
          patch(shell,"import { lessonFortyFiveOpening } from './LessonFortyFiveOpening';", "import { lessonFortyFiveOpening } from './LessonFortyFiveOpening';import { lessonFortySixOpening } from './LessonFortySixOpening';")
          patch(shell,'Array.from({length:45},(_,i)=>i+1)','Array.from({length:46},(_,i)=>i+1)')
          patch(shell,'lessonFortyFourOpening,lessonFortyFiveOpening];','lessonFortyFourOpening,lessonFortyFiveOpening,lessonFortySixOpening];')
          patch(shell,'const runtime=selectedLesson===45?<PolygonConstructionPlayer key="lesson-45"/>:', 'const runtime=selectedLesson===46?<TriangleTypesPlayer key="lesson-46"/>:selectedLesson===45?<PolygonConstructionPlayer key="lesson-45"/>:')
          patch(shell,'selectedLesson===43||selectedLesson===44||selectedLesson===45?', 'selectedLesson===43||selectedLesson===44||selectedLesson===45||selectedLesson===46?')
          ep='src/data/extendedPracticeData.ts'
          patch(ep,"import { extendedPracticeLesson45 } from './extendedPracticeLesson45';", "import { extendedPracticeLesson45 } from './extendedPracticeLesson45';\nimport { extendedPracticeLesson46 } from './extendedPracticeLesson46';")
          patch(ep,'44:extendedPracticeLesson44,45:extendedPracticeLesson45};','44:extendedPracticeLesson44,45:extendedPracticeLesson45,46:extendedPracticeLesson46};')
          patch(ep,'43:[],44:[],45:[]};','43:[],44:[],45:[],46:[]};')
          cp='tests/course-plan.spec.ts'
          patch(cp,'through lesson 45','through lesson 46')
          patch(cp,'toHaveCount(43);','toHaveCount(44);')
          patch(cp,'toHaveCount(45);','toHaveCount(46);')
          patch(cp,'for(let index=33;index<=44;index+=1)','for(let index=33;index<=45;index+=1)')
          patch(cp,"await expect(lessons.nth(45)).toContainText('Треугольник и его виды');\n  await expect(lessons.nth(45)).toBeDisabled();", "await expect(lessons.nth(45)).toContainText('Треугольник и его виды');\n  await expect(lessons.nth(45)).toBeEnabled();\n  await expect(lessons.nth(46)).toContainText('Треугольник и его виды');\n  await expect(lessons.nth(46)).toBeDisabled();")
          patch(cp,'Полностью готовы 45 уроков.','Полностью готовы 46 уроков.')
          patch('tests/extended-practice-count.spec.ts','lessonNumber<=45','lessonNumber<=46')
          patch('tests/pedagogical-practice-quality.spec.ts','lessonNumber<=45','lessonNumber<=46')
          patch('tests/extended-practice-all-lessons.spec.ts','40:36,41:36,42:36};','40:36,41:36,42:36,46:36};')
          p=Path('tests/lesson-forty-five-ipad.spec.ts'); text=p.read_text(); old="const lesson45=page.getByRole('button',{name:/Открыть урок 45:/});const lesson46=page.locator('.course-lesson-grid > button').nth(45);await expect(lesson45).toBeVisible();await expect(lesson45).toBeEnabled();await expect(lesson46).toBeDisabled();"; new="const lesson45=page.getByRole('button',{name:/Открыть урок 45:/});const lesson46=page.locator('.course-lesson-grid > button').nth(45);const lesson47=page.locator('.course-lesson-grid > button').nth(46);await expect(lesson45).toBeVisible();await expect(lesson45).toBeEnabled();await expect(lesson46).toBeEnabled();await expect(lesson47).toBeDisabled();"
          if old in text:p.write_text(text.replace(old,new))
          elif new not in text:raise SystemExit('lesson45 boundary pattern missing')
          PY
      - name: Verify source integration
        run: |
          npm install
          npm run build
          npx playwright install --with-deps chromium
          npx playwright test tests/course-plan.spec.ts tests/lesson-forty-six-full-flow.spec.ts tests/lesson-forty-six-ipad.spec.ts tests/extended-practice-count.spec.ts tests/pedagogical-practice-quality.spec.ts --config=playwright.desktop.config.ts --workers=1
      - name: Commit integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src tests
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Integrate lesson 46 into course runtime'
          git push origin HEAD:agent/lesson-46-triangle-types
