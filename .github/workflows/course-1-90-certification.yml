# Delta release gate for Control work №5. Cumulative 62-89 regression stays gated separately.
name: Course 1-90 certification

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: course-1-90-certification-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  chromium-90:
    name: Chromium · control, Sulafat and pronunciation 1-90
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - name: Pronunciation normalization contract
        run: npx playwright test tests/audio-content-pronunciation.spec.ts --config=playwright.desktop.config.ts --workers=1 --grep "pronunciation normalization"
      - name: Pronunciation stress dictionary contract
        run: npx playwright test tests/audio-content-pronunciation.spec.ts --config=playwright.desktop.config.ts --workers=1 --grep "pronunciation dictionary"
      - name: Extended Practice Content Pronunciation Audit lessons 1-90
        run: npx playwright test tests/audio-all-stages-pronunciation.spec.ts --config=playwright.desktop.config.ts --workers=1 --grep "Extended Practice Content/Pronunciation Audit 1-90"
      - name: Mentor Content Pronunciation Audit
        run: npx playwright test tests/audio-all-stages-pronunciation.spec.ts --config=playwright.desktop.config.ts --workers=1 --grep "Mentor Content/Pronunciation Audit"
      - run: npx playwright install --with-deps chromium
      - name: Verify course boundary and source-exact control contract
        run: >-
          npx playwright test
          tests/course-plan.spec.ts
          tests/pedagogical-practice-quality.spec.ts
          tests/extended-practice-count.spec.ts
          tests/lesson-ninety-source.spec.ts
          --config=playwright.desktop.config.ts --workers=1
      - name: Complete Control work №5 and frozen-score correction contract
        run: >-
          npx playwright test
          tests/lesson-ninety-full-flow.spec.ts
          tests/lesson-ninety-control-integrity.spec.ts
          tests/lesson-ninety-ipad.spec.ts
          --config=playwright.desktop.config.ts --workers=1
      - name: Verify Sulafat interruption without pre-submit solution leakage
        run: npx playwright test tests/lesson-ninety-voice.spec.ts --config=playwright.desktop.config.ts --workers=1
      - name: Audio Content Audit opening TTS payloads lessons 1-90
        run: npx playwright test tests/audio-content-pronunciation.spec.ts --config=playwright.desktop.config.ts --workers=1 --grep "Audio Content Audit 1-90"
      - name: In-lesson Stage Content Pronunciation Audit lessons 1-30
        id: stage_1_30
        continue-on-error: true
        run: npx playwright test tests/audio-all-stages-pronunciation.spec.ts --config=playwright.desktop.config.ts --workers=1 --grep "In-lesson Stage Content/Pronunciation Audit 1-30"
      - name: In-lesson Stage Content Pronunciation Audit lessons 31-60
        id: stage_31_60
        continue-on-error: true
        run: npx playwright test tests/audio-all-stages-pronunciation.spec.ts --config=playwright.desktop.config.ts --workers=1 --grep "In-lesson Stage Content/Pronunciation Audit 31-60"
      - name: In-lesson Stage Content Pronunciation Audit lessons 61-90
        id: stage_61_90
        continue-on-error: true
        run: npx playwright test tests/audio-all-stages-pronunciation.spec.ts --config=playwright.desktop.config.ts --workers=1 --grep "In-lesson Stage Content/Pronunciation Audit 61-90"
      - name: Require all in-lesson stage audit ranges to pass
        if: always()
        run: |
          echo "1-30:  ${{ steps.stage_1_30.outcome }}"
          echo "31-60: ${{ steps.stage_31_60.outcome }}"
          echo "61-90: ${{ steps.stage_61_90.outcome }}"
          test "${{ steps.stage_1_30.outcome }}" = success
          test "${{ steps.stage_31_60.outcome }}" = success
          test "${{ steps.stage_61_90.outcome }}" = success
      - name: Upload Audio Content Audit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audio-content-pronunciation-report
          path: test-results/desktop-results.json
          if-no-files-found: error
          retention-days: 3

  webkit-90:
    name: iPad WebKit control runtime + audio hard test 1-90
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - run: npx playwright install --with-deps webkit
      - name: Verify Control work №5 on iPad WebKit
        run: npx playwright test tests/lesson-ninety-full-flow.spec.ts tests/lesson-ninety-control-integrity.spec.ts tests/lesson-ninety-ipad.spec.ts --workers=1
      - name: Audio Hard-Test lessons 1-90
        run: npm run test:audio -- --workers=1

  certified:
    name: COURSE 1-90 DELTA CERTIFIED
    if: always()
    needs: [chromium-90, webkit-90]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless both focused Control work №5 lanes passed
        env:
          CHROMIUM_90: ${{ needs.chromium-90.result }}
          WEBKIT_90: ${{ needs.webkit-90.result }}
        run: |
          test "$CHROMIUM_90" = success
          test "$WEBKIT_90" = success
          echo "Control work №5, Audio Hard-Test and full Content/Pronunciation Audit 1-90 are certified."