name: Lesson 15 coordinate visual regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/ScaleCoordinateRaySummaryPlayer.tsx'
      - 'tests/lesson-fifteen-coordinate-visual.spec.ts'
      - '.github/workflows/lesson15-coordinate-visual.yml'
  push:
    branches: [main]
    paths:
      - 'src/ScaleCoordinateRaySummaryPlayer.tsx'
      - 'tests/lesson-fifteen-coordinate-visual.spec.ts'
      - '.github/workflows/lesson15-coordinate-visual.yml'

permissions:
  contents: read

jobs:
  coordinate-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Run coordinate visual regression
        run: npx playwright test tests/lesson-fifteen-coordinate-visual.spec.ts --config=playwright.desktop.config.ts --workers=1
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lesson15-coordinate-visual-${{ github.sha }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
