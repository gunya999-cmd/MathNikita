name: Lesson 29 hard retest

on:
  workflow_dispatch:
  push:
    branches: [feat/lesson-29-word-problems]
  pull_request:
    branches: [main, feat/lesson-28-estimation]
    paths:
      - 'src/NaturalNumberWordProblemsPlayer.tsx'
      - 'src/LessonTwentyNineOpening.ts'
      - 'src/data/extendedPracticeLesson29.ts'
      - 'src/data/extendedPracticeData.ts'
      - 'src/NaturalNumberEstimatePlayer.tsx'
      - 'src/LessonCourseShell.tsx'
      - 'src/data/yearPlan.ts'
      - 'tests/lesson-twenty-nine-ipad.spec.ts'
      - 'tests/extended-practice-all-lessons.spec.ts'
      - 'tests/course-plan.spec.ts'
      - '.github/workflows/lesson-29-hard-retest.yml'

permissions:
  contents: read

concurrency:
  group: lesson-29-hard-retest-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build · lesson 29
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run build

  chromium:
    name: Chromium · lesson 29 flow and 20-task practice
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Lesson 29 interaction, persistence and layout
        run: npx playwright test tests/lesson-twenty-nine-ipad.spec.ts --config=playwright.desktop.config.ts --workers=1
      - name: Complete all 20 mandatory-practice tasks
        env:
          PRACTICE_START: 29
          PRACTICE_END: 29
        run: npx playwright test tests/extended-practice-all-lessons.spec.ts --config=playwright.desktop.config.ts --workers=1
      - name: Course catalog regression
        run: npx playwright test tests/course-plan.spec.ts --config=playwright.desktop.config.ts --workers=1
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lesson-29-chromium-${{ github.sha }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  ipad:
    name: iPad WebKit · lesson 29 flow and 20-task practice
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx playwright install --with-deps webkit
      - name: Lesson 29 full responsive flow
        run: npx playwright test tests/lesson-twenty-nine-ipad.spec.ts --config=playwright.config.ts --workers=1
      - name: Complete all 20 mandatory-practice tasks
        env:
          PRACTICE_START: 29
          PRACTICE_END: 29
        run: npx playwright test tests/extended-practice-all-lessons.spec.ts --config=playwright.config.ts --workers=1
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lesson-29-ipad-${{ github.sha }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
