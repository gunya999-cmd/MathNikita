name: Lesson 74 wiring

on:
  push:
    branches: [agent/lesson-74-area-foundations]

permissions:
  contents: write

jobs:
  wire:
    if: ${{ !contains(github.event.head_commit.message, '[wire74]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lesson-74-area-foundations
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/wire-lesson74.mjs
      - name: Commit wiring and remove one-shot helper
        run: |
          rm scripts/wire-lesson74.mjs .github/workflows/lesson-74-wire.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "lesson74: wire runtime catalog and practice [wire74]"
          git push
