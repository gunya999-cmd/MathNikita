# Delta release gate for lesson 79. Earlier certification workflows continue to protect prior lessons.
name: Course 1-79 certification

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: course-1-79-certification-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-content:
    name: Build + content + pedagogy through 79
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: >-
          npx playwright test
          tests/course-plan.spec.ts
          tests/pedagogical-practice-quality.spec.ts
          tests/extended-practice-count.spec.ts
          tests/lesson-seventy-nine-source.spec.ts
          tests/lesson-seventy-nine-full-flow.spec.ts
          --config=playwright.desktop.config.ts --workers=1
      - name: Complete all 20 mandatory practice tasks / 50 responses for lesson 79
        run: npx playwright test tests/lesson-seventy-nine-practice.spec.ts --config=playwright.desktop.config.ts --workers=1

  chromium-79:
    name: Chromium runtime 79
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/lesson-seventy-nine-full-flow.spec.ts tests/lesson-seventy-nine-ipad.spec.ts --config=playwright.desktop.config.ts --workers=1

  webkit-79:
    name: iPad WebKit runtime 79
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx playwright install --with-deps webkit
      - run: npx playwright test tests/lesson-seventy-nine-full-flow.spec.ts tests/lesson-seventy-nine-ipad.spec.ts --workers=1

  voice-79:
    name: Sulafat voice + interruption 79
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/lesson-seventy-nine-voice.spec.ts --config=playwright.desktop.config.ts --workers=1

  certified:
    name: COURSE 1-79 DELTA CERTIFIED
    if: always()
    needs: [build-content, chromium-79, webkit-79, voice-79]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every lesson 79 release lane passed
        env:
          BUILD_CONTENT: ${{ needs.build-content.result }}
          CHROMIUM_79: ${{ needs.chromium-79.result }}
          WEBKIT_79: ${{ needs.webkit-79.result }}
          VOICE_79: ${{ needs.voice-79.result }}
        run: |
          test "$BUILD_CONTENT" = success
          test "$CHROMIUM_79" = success
          test "$WEBKIT_79" = success
          test "$VOICE_79" = success
          echo "Lesson 79 delta is certified."
