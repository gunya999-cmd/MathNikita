name: Lesson 37 integration patch

on:
  push:
    branches: [agent/lesson-37-angle-notation]
    paths: ['.github/workflows/lesson-37-integrate.yml']

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lesson-37-angle-notation
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Wire lesson 37 into course and QA contracts
        run: |
          node <<'NODE'
          const fs=require('fs');
          function edit(path,fn){const before=fs.readFileSync(path,'utf8');const after=fn(before);if(after===before)throw new Error(`No change produced for ${path}`);fs.writeFileSync(path,after)}
          function one(s,from,to,label){if(!s.includes(from))throw new Error(`Missing ${label}`);return s.replace(from,to)}

          edit('src/LessonCourseShell.tsx',s=>{
            s=one(s,"import { EquationLessonPlayer } from './EquationLessonPlayer';import { EquationPracticePlayer } from './EquationPracticePlayer';import { EquationMasteryPlayer } from './EquationMasteryPlayer';","import { EquationLessonPlayer } from './EquationLessonPlayer';import { EquationPracticePlayer } from './EquationPracticePlayer';import { EquationMasteryPlayer } from './EquationMasteryPlayer';import { AngleNotationPlayer } from './AngleNotationPlayer';",'lesson37 player import');
            s=one(s,"import { lessonThirtyFiveOpening } from './LessonThirtyFiveOpening';import { lessonThirtySixOpening } from './LessonThirtySixOpening';","import { lessonThirtyFiveOpening } from './LessonThirtyFiveOpening';import { lessonThirtySixOpening } from './LessonThirtySixOpening';import { lessonThirtySevenOpening } from './LessonThirtySevenOpening';",'lesson37 opening import');
            s=one(s,'const readyLessons=Array.from({length:36},(_,i)=>i+1);','const readyLessons=Array.from({length:37},(_,i)=>i+1);','ready lessons');
            s=one(s,'lessonThirtyFourOpening,lessonThirtyFiveOpening,lessonThirtySixOpening];','lessonThirtyFourOpening,lessonThirtyFiveOpening,lessonThirtySixOpening,lessonThirtySevenOpening];','opening registry');
            s=one(s,'const runtime=selectedLesson===36?<EquationMasteryPlayer key="lesson-36"/>:','const runtime=selectedLesson===37?<AngleNotationPlayer key="lesson-37"/>:selectedLesson===36?<EquationMasteryPlayer key="lesson-36"/>:','runtime registry');
            return s;
          });

          edit('src/data/extendedPracticeData.ts',s=>{
            s=one(s,"import { extendedPracticeLesson36 } from './extendedPracticeLesson36';","import { extendedPracticeLesson36 } from './extendedPracticeLesson36';\nimport { extendedPracticeLesson37 } from './extendedPracticeLesson37';",'practice37 import');
            s=one(s,'34:extendedPracticeLesson34,35:extendedPracticeLesson35,36:extendedPracticeLesson36};','34:extendedPracticeLesson34,35:extendedPracticeLesson35,36:extendedPracticeLesson36,37:extendedPracticeLesson37};','practice registry');
            s=one(s,'34:[],35:[],36:[]};','34:[],35:[],36:[],37:[]};','mastery registry');
            return s;
          });

          edit('src/data/yearPlan.ts',s=>one(s,'available:segment.from+offset<=36','available:segment.from+offset<=37','year plan availability'));

          edit('src/CourseCatalog.tsx',s=>{
            s=one(s,"36:'Итог § 10: смешанные уравнения, текстовые модели в обе стороны, диагностика ошибок, оценка корня, проверка подстановкой и нестандартные задачи.'};","36:'Итог § 10: смешанные уравнения, текстовые модели в обе стороны, диагностика ошибок, оценка корня, проверка подстановкой и нестандартные задачи.',37:'Новая тема § 11: угол как два луча с общим началом, вершина и стороны, обозначение угла тремя буквами, обратные названия и неоднозначные случаи.'};",'catalog lesson37 description');
            s=one(s,'Полностью готовы 36 интерактивных уроков.','Полностью готовы 37 интерактивных уроков.','catalog ready count');
            return s;
          });

          edit('src/App.tsx',s=>one(s,"i===1?'16 уроков готовы'","i===1?'17 уроков готовы'",'knowledge map ready count'));
          edit('tests/pedagogical-practice-quality.spec.ts',s=>one(s,'lessonNumber<=36','lessonNumber<=37','pedagogical range'));
          edit('tests/extended-practice-all-lessons.spec.ts',s=>one(s,'{18:24,20:11,34:28,35:28,36:30}','{18:24,20:11,34:28,35:28,36:30,37:30}','stage count registry'));

          edit('tests/course-plan.spec.ts',s=>{
            s=one(s,'through lesson 36','through lesson 37','course plan title');
            s=one(s,'.toHaveCount(34);','.toHaveCount(35);','interactive count');
            s=one(s,'.toHaveCount(36);','.toHaveCount(37);','enabled count');
            s=one(s,"  await expect(lessons.nth(36)).toContainText('Угол. Обозначение углов');\n  await expect(lessons.nth(36)).toBeDisabled();","  await expect(lessons.nth(36)).toContainText('Угол. Обозначение углов');\n  await expect(lessons.nth(36)).toBeEnabled();\n  await expect(lessons.nth(36)).toHaveClass(/is-interactive/);\n  await expect(lessons.nth(37)).toContainText('Угол. Обозначение углов');\n  await expect(lessons.nth(37)).toBeDisabled();",'lesson37/38 catalog assertions');
            s=one(s,'Полностью готовы 36 интерактивных уроков.','Полностью готовы 37 интерактивных уроков.','course plan ready text');
            return s;
          });
          NODE
      - name: Validate integration build
        run: |
          npm install
          npm run build
      - name: Commit integration
        run: |
          git config user.name "gunya999-cmd"
          git config user.email "gunya999@gmail.com"
          git add src/LessonCourseShell.tsx src/data/extendedPracticeData.ts src/data/yearPlan.ts src/CourseCatalog.tsx src/App.tsx tests/pedagogical-practice-quality.spec.ts tests/extended-practice-all-lessons.spec.ts tests/course-plan.spec.ts
          git commit -m "Wire lesson 37 into course"
          git push origin HEAD:agent/lesson-37-angle-notation
