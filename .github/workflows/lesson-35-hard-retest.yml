name: Lesson 35 hard retest

on:
  workflow_dispatch:
  push:
    branches: [feat/lesson-35-equations-practice]
  pull_request:
    branches: [main]
    paths:
      - 'src/EquationPracticePlayer.tsx'
      - 'src/LessonThirtyFiveOpening.ts'
      - 'src/data/extendedPracticeLesson35.ts'
      - 'src/data/extendedPracticeData.ts'
      - 'src/data/yearPlan.ts'
      - 'src/LessonCourseShell.tsx'
      - 'src/CourseCatalog.tsx'
      - 'tests/lesson-thirty-five-ipad.spec.ts'
      - 'tests/lesson-thirty-five-voice.spec.ts'
      - 'tests/course-plan.spec.ts'
      - 'tests/pedagogical-practice-quality.spec.ts'

permissions:
  contents: read

concurrency:
  group: lesson-35-hard-retest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build · lesson 35
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm install
      - run: npm run build
      - run: npx playwright test tests/pedagogical-practice-quality.spec.ts tests/extended-practice-count.spec.ts --config=playwright.desktop.config.ts --workers=1

  chromium:
    name: Chromium · lesson 35 flow, voice and 20-task practice
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRACTICE_START: '35'
      PRACTICE_END: '35'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/lesson-thirty-five-ipad.spec.ts tests/lesson-thirty-five-voice.spec.ts tests/extended-practice-all-lessons.spec.ts tests/course-plan.spec.ts --config=playwright.desktop.config.ts --workers=1

  webkit:
    name: iPad WebKit · lesson 35 flow, voice and 20-task practice
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PRACTICE_START: '35'
      PRACTICE_END: '35'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: npm install
      - run: npx playwright install --with-deps webkit
      - run: npx playwright test tests/lesson-thirty-five-ipad.spec.ts tests/lesson-thirty-five-voice.spec.ts tests/extended-practice-all-lessons.spec.ts tests/course-plan.spec.ts --config=playwright.config.ts --workers=1
