name: Lesson 99 certification

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: lesson-99-certification-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  chromium-99:
    name: Chromium · source, flow and Sulafat lesson 99
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Source, player and course-boundary contract
        run: npx playwright test tests/lesson-ninety-nine-data.spec.ts tests/lesson-ninety-nine-player.spec.ts tests/course-plan.spec.ts --config=playwright.desktop.config.ts --workers=1
      - name: Opening, navigation and mandatory practice flow
        run: npx playwright test tests/lesson-ninety-nine-flow.spec.ts --config=playwright.desktop.config.ts --workers=1
      - name: Sulafat narration payload audit
        run: npx playwright test tests/lesson-ninety-nine-voice.spec.ts --config=playwright.desktop.config.ts --workers=1

  webkit-99:
    name: iPad WebKit · lesson 99
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - run: npm install
      - run: npx playwright install --with-deps webkit
      - name: iPad layout and exact source task
        run: npx playwright test tests/lesson-ninety-nine-ipad.spec.ts --workers=1

  certified:
    name: LESSON 99 CERTIFIED
    if: always()
    needs: [chromium-99, webkit-99]
    runs-on: ubuntu-latest
    steps:
      - name: Require Chromium and iPad lanes
        env:
          CHROMIUM_99: ${{ needs.chromium-99.result }}
          WEBKIT_99: ${{ needs.webkit-99.result }}
        run: |
          test "$CHROMIUM_99" = success
          test "$WEBKIT_99" = success
          echo "Lesson 99 source, flow, boundary, mandatory practice, Sulafat and iPad checks are certified."
